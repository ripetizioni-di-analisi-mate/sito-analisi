<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="600" height="465" viewBox="0 0 600 465" role="img" aria-labelledby="title desc"><title id="title">Fischer, D/L and R/S</title><desc id="desc">CHO above, CH2OH below. D has OH right; L has OH left.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#173d44"/></marker></defs><g><text x="300" y="34" font-size="26" fill="currentColor" text-anchor="middle">Glyceraldehyde Fischer projections</text><text x="155" y="97" font-size="27" fill="currentColor" text-anchor="middle">CHO</text><line x1="155" y1="108" x2="155" y2="254" stroke="#173d44" stroke-width="3" /><text x="155" y="286" font-size="27" fill="currentColor" text-anchor="middle">CH₂OH</text><line x1="90" y1="183" x2="220" y2="183" stroke="#173d44" stroke-width="3" /><text x="60" y="191" font-size="27" fill="currentColor" text-anchor="middle">H</text><text x="250" y="191" font-size="27" fill="currentColor" text-anchor="middle">OH</text><text x="155" y="337" font-size="27" fill="#087e83" text-anchor="middle">D · R</text><text x="445" y="97" font-size="27" fill="currentColor" text-anchor="middle">CHO</text><line x1="445" y1="108" x2="445" y2="254" stroke="#173d44" stroke-width="3" /><text x="445" y="286" font-size="27" fill="currentColor" text-anchor="middle">CH₂OH</text><line x1="380" y1="183" x2="510" y2="183" stroke="#173d44" stroke-width="3" /><text x="350" y="191" font-size="27" fill="currentColor" text-anchor="middle">OH</text><text x="540" y="191" font-size="27" fill="currentColor" text-anchor="middle">H</text><text x="445" y="337" font-size="27" fill="#087e83" text-anchor="middle">L · S</text><text x="300" y="393" font-size="23" fill="currentColor" text-anchor="middle">Horizontal: forwards · vertical: backwards</text><text x="300" y="432" font-size="23" fill="currentColor" text-anchor="middle">Optical sign requires a measurement</text></g></svg>