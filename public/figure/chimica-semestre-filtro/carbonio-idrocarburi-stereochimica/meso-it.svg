<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="600" height="525" viewBox="0 0 600 525" role="img" aria-labelledby="title desc"><title id="title">Simmetria e stereoisomeri</title><desc id="desc">RR e SS sono speculari; SR è meso e coincide con RS.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#173d44"/></marker></defs><g><text x="300" y="32" font-size="25" fill="currentColor" text-anchor="middle">2,3-diclorobutano</text><text x="100" y="88" font-size="25" fill="currentColor" text-anchor="middle">CH₃</text><line x1="100" y1="100" x2="100" y2="328" stroke="#173d44" stroke-width="3" /><text x="100" y="360" font-size="25" fill="currentColor" text-anchor="middle">CH₃</text><line x1="58" y1="170" x2="142" y2="170" stroke="#173d44" stroke-width="3" /><text x="35" y="178" font-size="23" fill="currentColor" text-anchor="middle">Cl</text><text x="165" y="178" font-size="23" fill="currentColor" text-anchor="middle">H</text><line x1="58" y1="260" x2="142" y2="260" stroke="#173d44" stroke-width="3" /><text x="35" y="268" font-size="23" fill="currentColor" text-anchor="middle">H</text><text x="165" y="268" font-size="23" fill="currentColor" text-anchor="middle">Cl</text><text x="100" y="402" font-size="22" fill="#087e83" text-anchor="middle">(2R,3R)</text><text x="300" y="88" font-size="25" fill="currentColor" text-anchor="middle">CH₃</text><line x1="300" y1="100" x2="300" y2="328" stroke="#173d44" stroke-width="3" /><text x="300" y="360" font-size="25" fill="currentColor" text-anchor="middle">CH₃</text><line x1="258" y1="170" x2="342" y2="170" stroke="#173d44" stroke-width="3" /><text x="235" y="178" font-size="23" fill="currentColor" text-anchor="middle">H</text><text x="365" y="178" font-size="23" fill="currentColor" text-anchor="middle">Cl</text><line x1="258" y1="260" x2="342" y2="260" stroke="#173d44" stroke-width="3" /><text x="235" y="268" font-size="23" fill="currentColor" text-anchor="middle">Cl</text><text x="365" y="268" font-size="23" fill="currentColor" text-anchor="middle">H</text><text x="300" y="402" font-size="22" fill="#087e83" text-anchor="middle">(2S,3S)</text><text x="500" y="88" font-size="25" fill="currentColor" text-anchor="middle">CH₃</text><line x1="500" y1="100" x2="500" y2="328" stroke="#173d44" stroke-width="3" /><text x="500" y="360" font-size="25" fill="currentColor" text-anchor="middle">CH₃</text><line x1="458" y1="170" x2="542" y2="170" stroke="#173d44" stroke-width="3" /><text x="435" y="178" font-size="23" fill="currentColor" text-anchor="middle">H</text><text x="565" y="178" font-size="23" fill="currentColor" text-anchor="middle">Cl</text><line x1="458" y1="260" x2="542" y2="260" stroke="#173d44" stroke-width="3" /><text x="435" y="268" font-size="23" fill="currentColor" text-anchor="middle">H</text><text x="565" y="268" font-size="23" fill="currentColor" text-anchor="middle">Cl</text><text x="500" y="402" font-size="22" fill="#087e83" text-anchor="middle">(2S,3R)</text><text x="200" y="450" font-size="23" fill="currentColor" text-anchor="middle">Enantiomeri</text><text x="500" y="450" font-size="23" fill="currentColor" text-anchor="middle">meso</text><text x="300" y="493" font-size="23" fill="currentColor" text-anchor="middle">Tre stereoisomeri, non quattro</text></g></svg>