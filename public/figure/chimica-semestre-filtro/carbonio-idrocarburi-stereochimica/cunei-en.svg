<svg xmlns="http://www.w3.org/2000/svg" width="500" height="475" viewBox="0 0 500 475" role="img" aria-labelledby="title desc"><title id="title">Bonds outside the plane</title><desc id="desc">A carbon bonded to OH, COOH, CH3 and H.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#173d44"/></marker></defs><rect width="500" height="475" fill="white"/><g font-family="Arial, sans-serif"><text x="250" y="32" font-size="25" fill="#173d44" text-anchor="middle">Wedge directions</text><text x="250" y="219" font-size="29" fill="#173d44" text-anchor="middle">C</text><line x1="250" y1="190" x2="250" y2="102" stroke="#173d44" stroke-width="3" /><text x="250" y="84" font-size="27" fill="#173d44" text-anchor="middle">OH</text><line x1="269" y1="210" x2="364" y2="210" stroke="#173d44" stroke-width="3" /><text x="407" y="218" font-size="26" fill="#173d44" text-anchor="middle">COOH</text><polygon points="239,225 159,319 183,333" fill="#087e83"/><text x="155" y="359" font-size="27" fill="#087e83" text-anchor="middle">CH₃</text><line x1="219.78" y1="200.79" x2="220.97" y2="196.71" stroke="#27629d" stroke-width="2" /><line x1="204.84" y1="197.62" x2="206.66" y2="191.38" stroke="#27629d" stroke-width="2" /><line x1="189.9" y1="194.45" x2="192.35" y2="186.05" stroke="#27629d" stroke-width="2" /><line x1="174.96" y1="191.28" x2="178.04" y2="180.72" stroke="#27629d" stroke-width="2" /><line x1="160.02" y1="188.11" x2="163.73" y2="175.39" stroke="#27629d" stroke-width="2" /><line x1="145.08" y1="184.94" x2="149.42" y2="170.06" stroke="#27629d" stroke-width="2" /><line x1="130.14" y1="181.77" x2="135.11" y2="164.73" stroke="#27629d" stroke-width="2" /><text x="99" y="170" font-size="27" fill="#27629d" text-anchor="middle">H</text><text x="250" y="407" font-size="21" fill="#087e83" text-anchor="middle">Solid: towards the observer</text><text x="250" y="443" font-size="21" fill="#