<svg xmlns="http://www.w3.org/2000/svg" width="380" height="465" viewBox="0 0 380 465" role="img" aria-labelledby="title"><title id="title">Fischer and R/S configuration</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#097d87"/></marker></defs><rect width="380" height="465" fill="#fff"/><g font-family="DejaVu Sans, sans-serif"><text x="190" y="29" font-size="19" text-anchor="middle" fill="#173b56" font-weight="bold">Fischer and R/S configuration</text><text x="190" y="59" font-size="15" text-anchor="middle" fill="#173b56" font-weight="normal">COOH at top; R at bottom</text><text x="98" y="100" font-size="18" text-anchor="middle" fill="#173b56" font-weight="bold">L-alanine</text><line x1="98" y1="142" x2="98" y2="254" stroke="#173b56" stroke-width="2"/><line x1="60" y1="198" x2="136" y2="198" stroke="#173b56" stroke-width="2"/><text x="98" y="135" font-size="17" text-anchor="middle" fill="#173b56" font-weight="normal">COOH</text><text x="98" y="278" font-size="17" text-anchor="middle" fill="#173b56" font-weight="normal">CH₃</text><text x="54" y="204" font-size="17" text-anchor="end" fill="#173b56" font-weight="normal">H₂N</text><text x="142" y="204" font-size="17" text-anchor="start" fill="#173b56" font-weight="normal">H</text><text x="98" y="315" font-size="20" text-anchor="middle" fill="#097d87" font-weight="normal">Cα: S</text><text x="282" y="100" font-size="18" text-anchor="middle" fill="#173b56" font-weight="bold">L-cysteine</text><line x1="282" y1="142" x2="282" y2="254" stroke="#173b56" stroke-width="2"/><line x1="244" y1="198" x2="320" y2="198" stroke="#173b56" stroke-width="2"/><text x="282" y="135" font-size="17" text-anchor="middle" fill="#173b56" font-weight="normal">COOH</text><text x="282" y="278" font-size="17" text-anchor="middle" fill="#173b56" font-weight="normal">CH₂SH</text><text x="238" y="204" font-size="17" text-anchor="end" fill="#173b56" font-weight="normal">H₂N</text><text x="326" y="204" font-size="17" text-anchor="start" fill="#173b56" font-weight="normal">H</text><text x="282" y="315" font-size="20" text-anchor="middle" fill="#097d87" font-weight="normal">Cα: R</text><rect x="18" y="345" width="344" height="98" rx="9" fill="#eaf5f6"/><text x="190" y="373" font-size="15" text-anchor="middle" fill="#173b56" font-weight="normal">Horizontal: towards the observer</text><text x="190" y="401" font-size="15" text-anchor="middle" fill="#173b56" font-weight="normal">Vertical: away from the observer</text><text x="190" y="429" font-size="15" text-anchor="middle" fill="#173b56" font-weight="normal">L does not determine optical sign.</text></g></svg>