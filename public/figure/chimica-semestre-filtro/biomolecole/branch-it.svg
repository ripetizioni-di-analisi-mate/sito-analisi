<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="380" height="405" viewBox="0 0 380 405" role="img" aria-labelledby="title"><title id="title">Una ramificazione del glicogeno</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#097d87"/></marker></defs><g><text x="190" y="29" font-size="19" text-anchor="middle" fill="currentColor" font-weight="bold">Una ramificazione del glicogeno</text><text x="190" y="63" font-size="15" text-anchor="middle" fill="currentColor" font-weight="normal">Ogni nodo rappresenta un glucosio.</text><rect x="36" y="223" width="58" height="44" rx="9" fill="#eaf5f6"/><text x="65" y="251" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">Glc</text><rect x="161" y="223" width="58" height="44" rx="9" fill="#eaf5f6"/><text x="190" y="251" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">Glc</text><rect x="286" y="223" width="58" height="44" rx="9" fill="#eaf5f6"/><text x="315" y="251" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">Glc</text><rect x="161" y="93" width="58" height="44" rx="9" fill="#eaf5f6"/><text x="190" y="121" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">Glc</text><path d="M95 245 L155 245" fill="none" stroke="#097d87" stroke-width="2" marker-end="url(#arrow)"/><path d="M221 245 L280 245" fill="none" stroke="#097d87" stroke-width="2" marker-end="url(#arrow)"/><path d="M190 143 L190 215" fill="none" stroke="#097d87" stroke-width="2" marker-end="url(#arrow)"/><text x="127" y="225" font-size="15" text-anchor="middle" fill="currentColor" font-weight="normal">α(1→4)</text><text x="253" y="225" font-size="15" text-anchor="middle" fill="currentColor" font-weight="normal">α(1→4)</text><text x="205" y="184" font-size="15" text-anchor="start" fill="#b4473d" font-weight="normal">α(1→6)</text><text x="190" y="308" font-size="15" text-anchor="midd