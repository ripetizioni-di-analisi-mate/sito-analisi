iddle" fill="currentColor" font-weight="bold">Ceramide: un legame ammidico</text><text x="35" y="527" font-size="17" text-anchor="start" fill="currentColor" font-weight="normal">CH₂—OH</text><line x1="41" y1="534" x2="41" y2="550" stroke="#173b56" stroke-width="2"/><text x="35" y="568" font-size="17" text-anchor="start" fill="currentColor" font-weight="normal">CH —NH—C(=O)—R</text><line x1="41" y1="575" x2="41" y2="591" stroke="#173b56" stroke-width="2"/><text x="35" y="609" font-size="17" text-anchor="start" fill="currentColor" font-weight="normal">CH —OH</text><line x1="41" y1="616" x2="41" y2="632" stroke="#173b56" stroke-width="2"/><text x="35" y="650" font-size="17" text-anchor="start" fill="currentColor" font-weight="normal">CH=CH—(CH₂)₁₂—CH₃</text><text x="190" y="728" font-size="14" text-anchor="middle" fill="currentColor" font-weight="normal">R: catene idrocarburiche; X: testa polare</text><text x="190" y="752" font-size="14" text-anchor="middle" fill="currentColor" font-weight="normal">Formule condensate; stereochimica omessa</text></g></svg>