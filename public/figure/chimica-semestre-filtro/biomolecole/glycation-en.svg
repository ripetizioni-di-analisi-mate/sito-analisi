<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="380" height="695" viewBox="0 0 380 695" role="img" aria-labelledby="title"><title id="title">Glycation of an aldehyde</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#097d87"/></marker></defs><g><text x="190" y="29" font-size="19" text-anchor="middle" fill="currentColor" font-weight="bold">Glycation of an aldehyde</text><text x="190" y="62" font-size="14" text-anchor="middle" fill="currentColor" font-weight="normal">Open forms; R = remainder of aldose</text><rect x="12" y="90" width="356" height="119" rx="9" fill="#eaf5f6"/><text x="190" y="117" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">Aldose + amine</text><text x="190" y="154" font-size="17" text-anchor="middle" fill="currentColor" font-weight="normal">O=CH—CH(OH)—R</text><text x="190" y="185" font-size="17" text-anchor="middle" fill="currentColor" font-weight="normal">+ H₂N—R′</text><rect x="12" y="270" width="356" height="119" rx="9" fill="#eaf5f6"/><text x="190" y="297" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">Schiff base</text><text x="190" y="334" font-size="17" text-anchor="middle" fill="currentColor" font-weight="normal">R′—N=CH—CH(OH)—R</text><text x="190" y="365" font-size="17" text-anchor="middle" fill="currentColor" font-weight="normal">+ H₂O</text><rect x="12" y="450" width="356" height="119" rx="9" fill="#eaf5f6"/><text x="190" y="477" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">Amadori product</text><text x="190" y="514" font-size="17" text-anchor="middle" fill="currentColor" font-weight="normal">R′—NH—CH₂—C(=O)—R</text><text x="190" y="545" font-size="17" text-anchor="middle" fill="currentColor" font-weight="normal"></text><path d="M190 215 L190 258" fill="none" stroke="#097d87" stroke-width="2" marker-end="url(#arrow)"/><text x="207" y="243" font-size="14" text-anchor="start" fill="currentColor" font-weight="normal">condensation</text><path d="M190 396 L190 438" fill="none" stroke="#097d87" stroke-width="2" marker-end="url(#arrow)"/><text x="207" y="420" font-size="14" text-anchor="start" fill="currentColor" font-weight="normal">rearrangement</text><text x="190" y="609" font-size="16" text-anchor="middle" fill="currentColor" font-weight="normal">C1: imine → amino group</text><text x="190" y="639" font-size="16" text-anchor="middle" fill="currentColor" font-weight="normal">C2: alcohol → ketone</text><text x="190" y="671" font-size="14" text-anchor="middle" fill="currentColor" font-weight="normal">Net scheme, intermediates omitted</text></g></svg>