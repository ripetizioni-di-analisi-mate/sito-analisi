<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title"><title id="title">Zinc–copper galvanic cell</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24766c"/></marker></defs><g><text x="360" y="42" font-size="27" text-anchor="middle" fill="currentColor">Zinc–copper galvanic cell</text><path d="M60 220 V425 H310 V220" stroke="#577c86" stroke-width="3" fill="none"/><rect x="63" y="285" width="244" height="137" fill="#d8eaf0"/><rect x="129" y="195" width="42" height="170" fill="#9caab1" stroke="#536c73"/><text x="150" y="394" font-size="27" text-anchor="middle" fill="currentColor">Zn</text><text x="232" y="330" font-size="24" text-anchor="middle" fill="currentColor">Zn²⁺(aq)</text><path d="M410 220 V425 H660 V220" stroke="#577c86" stroke-width="3" fill="none"/><rect x="413" y="285" width="244" height="137" fill="#d8eaf0"/><rect x="479" y="195" width="42" height="170" fill="#b6794d" stroke="#536c73"/><text x="500" y="394" font-size="27" text-anchor="middle" fill="currentColor">Cu</text><text x="582" y="330" font-size="24" text-anchor="middle" fill="currentColor">Cu²⁺(aq)</text><polyline points="150.00,195.00 150.00,103.00 500.00,103.00 500.00,195.00" fill="none" stroke="#577c86" stroke-width="3" stroke-linejoin="round"/><line x1="230" y1="103" x2="428" y2="103" stroke="#24766c" stroke-width="3" marker-end="url(#arr)"/><text x="330" y="87" font-size="25" text-anchor="middle" fill="currentColor">e⁻</text><path d="M270 300 V235 Q270 205 300 205 H420 Q450 205 450 235 V300" stroke="#c4a775" stroke-width="23" fill="none"/><text x="360" y="176" font-size="24" text-anchor="middle" fill="currentColor">KNO₃</text><line x1="324" y1="246" x2="272" y2="274" stroke="#24766c" stroke-width="3" marker-end="url(#arr)"/><line x1="396" y1="246" x2="448" y2="274" stroke="#24766c" stroke-width="3" marker-end="url(#arr)"/><text x="225" y="260" font-size="22" text-anchor="middle" fill="currentColor">NO₃⁻</text><text x="580" y="260" font-size="22" text-anchor="middle" fill="currentColor">K⁺</text><text x="184" y="470" font-size="25" text-anchor="middle" fill="currentColor">Anode (−)</text><text x="535" y="470" font-size="25" text-anchor="middle" fill="currentColor">Cathode (+)</text><text x="184" y="509" font-size="22" text-anchor="middle" fill="currentColor">Zn → Zn²⁺ + 2 e⁻</text><text x="535" y="509" font-size="22" text-anchor="middle" fill="currentColor">Cu²⁺ + 2 e⁻ → Cu</text></g></svg>
