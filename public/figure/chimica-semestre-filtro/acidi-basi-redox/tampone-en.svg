<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title"><title id="title">How a buffer reacts</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24766c"/></marker></defs><g><text x="360" y="42" font-size="27" text-anchor="middle" fill="currentColor">How a buffer reacts</text><text x="360" y="87" font-size="28" text-anchor="middle" fill="currentColor">A⁻ + H⁺ → HA</text><text x="360" y="125" font-size="24" text-anchor="middle" fill="currentColor">Before</text><rect x="160" y="145" width="160" height="52" rx="12" fill="#f5dfc7" stroke="#77a59a" stroke-width="2"/><rect x="320" y="145" width="240" height="52" rx="12" fill="#d3e9e4" stroke="#77a59a" stroke-width="2"/><text x="240" y="179" font-size="23" text-anchor="middle" fill="currentColor">HA: 20</text><text x="440" y="179" font-size="23" text-anchor="middle" fill="currentColor">A⁻: 30</text><text x="360" y="230" font-size="22" text-anchor="middle" fill="currentColor">Amount / mmol</text><text x="360" y="295" font-size="24" text-anchor="middle" fill="currentColor">After 5 mmol HCl</text><rect x="160" y="315" width="200" height="52" rx="12" fill="#f5dfc7" stroke="#77a59a" stroke-width="2"/><rect x="360" y="315" width="200" height="52" rx="12" fill="#d3e9e4" stroke="#77a59a" stroke-width="2"/><text x="260" y="349" font-size="23" text-anchor="middle" fill="currentColor">HA: 25</text><text x="460" y="349" font-size="23" text-anchor="middle" fill="currentColor">A⁻: 25</text><text x="360" y="400" font-size="22" text-anchor="middle" fill="currentColor">Amount / mmol</text><text x="360" y="475" font-size="25" text-anchor="middle" fill="currentColor">n(HA) + n(A⁻) = 50 mmol</text><text x="360" y="518" font-size="23" text-anchor="middle" fill="currentColor">Same total, different ratio</text></g></svg>