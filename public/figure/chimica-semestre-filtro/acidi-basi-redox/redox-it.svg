<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title"><title id="title">Bilancio di cinque elettroni</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24766c"/></marker></defs><rect width="720" height="560" rx="18" fill="#f7faf9"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="360" y="42" font-size="27" text-anchor="middle" fill="#183d42">Bilancio di cinque elettroni</text><rect x="80" y="110" width="560" height="105" rx="12" fill="#e6f2ef" stroke="#77a59a" stroke-width="2"/><text x="360" y="150" font-size="28" text-anchor="middle" fill="#183d42">5 Fe²⁺ → 5 Fe³⁺ + 5 e⁻</text><text x="360" y="190" font-size="23" text-anchor="middle" fill="#183d42">Ossidazione</text><line x1="360" y1="225" x2="360" y2="288" stroke="#24766c" stroke-width="3" marker-end="url(#arr)"/><text x="395" y="267" font-size="25" text-anchor="start" fill="#183d42">5 e⁻</text><rect x="50" y="300" width="620" height="115" rx="12" fill="#e6f2ef" stroke="#77a59a" stroke-width="2"/><text x="360" y="345" font-size="27" text-anchor="middle" fill="#183d42">MnO₄⁻ + 8 H⁺ + 5 e⁻</text><text x="360" y="388" font-size="27" text-anchor="middle" fill="#183d42">→ Mn²⁺ + 4 H₂O</text><text x="360" y="463" font-size="24" text-anchor="middle" fill="#183d42">Riduzione · ambiente acido</text><text x="360" y="510" font-size="22" text-anchor="middle" fill="#183d42">Gli elettroni si cancellano nella somma</text></g></svg>