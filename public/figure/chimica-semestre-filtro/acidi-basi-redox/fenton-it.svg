<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title"><title id="title">Fenton e riciclo del ferro</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24766c"/></marker></defs><g><text x="360" y="42" font-size="27" text-anchor="middle" fill="currentColor">Fenton e riciclo del ferro</text><rect x="80" y="215" width="160" height="80" rx="12" fill="#e6f2ef" stroke="#77a59a" stroke-width="2"/><rect x="480" y="215" width="160" height="80" rx="12" fill="#e6f2ef" stroke="#77a59a" stroke-width="2"/><text x="160" y="267" font-size="31" text-anchor="middle" fill="currentColor">Fe²⁺</text><text x="560" y="267" font-size="31" text-anchor="middle" fill="currentColor">Fe³⁺</text><polyline points="180.00,204.00 180.00,132.00 535.00,132.00 535.00,204.00" fill="none" stroke="#24766c" stroke-width="4" stroke-linejoin="round"/><line x1="535" y1="172" x2="535" y2="204" stroke="#24766c" stroke-width="3" marker-end="url(#arr)"/><text x="360" y="102" font-size="27" text-anchor="middle" fill="currentColor">H₂O₂ → OH⁻ + •OH</text><polyline points="550.00,308.00 550.00,403.00 175.00,403.00 175.00,308.00" fill="none" stroke="#24766c" stroke-width="4" stroke-linejoin="round"/><line x1="175" y1="345" x2="175" y2="308" stroke="#24766c" stroke-width="3" marker-end="url(#arr)"/><text x="360" y="447" font-size="28" text-anchor="middle" fill="currentColor">O₂•⁻ → O₂</text><text x="360" y="500" font-size="22" text-anchor="middle" fill="currentColor">Modello radicalico: il ferro viene riciclato</text></g></svg>