<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" width="520" height="410" role="img" aria-labelledby="title desc"><title id="title">Occupazione: Pauli e Hund</title><desc id="desc">Tre orbitali 2p con tre elettroni in N e quattro in O.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#23384e"/></marker></defs><rect width="520" height="410" fill="white"/><g font-family="Arial, sans-serif"><text x="260" y="31" font-size="22" text-anchor="middle" fill="#23384e">Occupazione: Pauli e Hund</text><text x="260" y="66" font-size="19" text-anchor="middle" fill="#23384e">Stati fondamentali: sottolivello 2p</text><text x="65" y="135" font-size="30" text-anchor="middle" fill="#23384e">N</text><rect x="135" y="95" width="85" height="70" rx="8" fill="#eef6f4" stroke="#b7cbd5" stroke-width="1.5"/><text x="177" y="142" font-size="33" text-anchor="middle" fill="#23384e">↑</text><rect x="240" y="95" width="85" height="70" rx="8" fill="#eef6f4" stroke="#b7cbd5" stroke-width="1.5"/><text x="282" y="142" font-size="33" text-anchor="middle" fill="#23384e">↑</text><rect x="345" y="95" width="85" height="70" rx="8" fill="#eef6f4" stroke="#b7cbd5" stroke-width="1.5"/><text x="387" y="142" font-size="33" text-anchor="middle" fill="#23384e">↑</text><text x="285" y="198" font-size="20" text-anchor="middle" fill="#23384e">3 elettroni spaiati</text><text x="65" y="265" font-size="30" text-anchor="middle" fill="#23384e">O</text><rect x="135" y="225" width="85" height="70" rx="8" fill="#eef6f4" stroke="#b7cbd5" stroke-width="1.5"/><text x="177" y="272" font-size="33" text-anchor="middle" fill="#23384e">↑↓</text><rect x="240" y="225" width="85" height="70" rx="8" fill="#eef6f4" stroke="#b7cbd5" stroke-width="1.5"/><text x="282" y="272" font-size="33" text-anchor="middle" fill="#23384e">↑</text><rect x="345" y="225" width="85" height="70" rx="8" fill="#eef6f4" stroke="#b7cbd5" stroke-width="1.5"/><text x="387" y="272" font-size="33" text-anchor="middle" fill="#23384e">↑</text><text x="285" y="328" font-size="20" text-anchor="middle" fill="#23384e">2 elettroni spaiati</text><text x="260" y="382" font-size="18" text-anchor="middle" fill="#23384e">Prima gli orbitali separati, poi le coppie.</text></g></svg>