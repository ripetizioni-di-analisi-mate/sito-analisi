<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 472" width="520" height="472" role="img" aria-labelledby="title desc"><title id="title">La temperatura cambia il segno di ΔG</title><desc id="desc">Retta con zero a 200 K, per entalpia ed entropia costanti nel modello.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#23384e"/></marker></defs><rect width="520" height="472" fill="white"/><g font-family="Arial, sans-serif"><text x="260" y="31" font-size="22" text-anchor="middle" fill="#23384e">La temperatura cambia il segno di ΔG</text><text x="260" y="68" font-size="20" text-anchor="middle" fill="#23384e">ΔG = 20 − 0,100 T  (kJ mol⁻¹)</text><rect x="80" y="80" width="385" height="97.1" fill="#fff4ec"/><rect x="80" y="177.1" width="385" height="177.9" fill="#edf7f4"/><line x1="80" y1="355" x2="488" y2="355" stroke="#23384e" stroke-width="3" marker-end="url(#arrow)"/><line x1="80" y1="355" x2="80" y2="78" stroke="#23384e" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="76" font-size="20" text-anchor="middle" fill="#23384e">ΔG</text><text x="457" y="410" font-size="20" text-anchor="middle" fill="#23384e">T (K)</text><line x1="80.0" y1="355" x2="80.0" y2="362" stroke="#23384e" stroke-width="1"/><text x="80.0" y="383" font-size="17" text-anchor="middle" fill="#23384e">100</text><line x1="208.33333333333331" y1="355" x2="208.33333333333331" y2="362" stroke="#23384e" stroke-width="1"/><text x="208.33333333333331" y="383" font-size="17" text-anchor="middle" fill="#23384e">200</text><line x1="336.66666666666663" y1="355" x2="336.66666666666663" y2="362" stroke="#23384e" stroke-width="1"/><text x="336.66666666666663" y="383" font-size="17" text-anchor="middle" fill="#23384e">300</text><line x1="465.0" y1="355" x2="465.0" y2="362" stroke="#23384e" stroke-width="1"/><text x="465.0" y="383" font-size="17" text-anchor="middle" fill="#23384e">400</text><line x1="80" y1="96.17647058823529" x2="465" y2="96.17647058823529" stroke="#c9d4da" stroke-width="1"/><text x="68" y="102.17647058823529" font-size="17" text-anchor="end" fill="#23384e">10</text><line x1="80" y1="177.05882352941177" x2="465" y2="177.05882352941177" stroke="#c9d4da" stroke-width="1" stroke-dasharray="6 5"/><text x="68" y="183.05882352941177" font-size="17" text-anchor="end" fill="#23384e">0</text><line x1="80" y1="257.94117647058823" x2="465" y2="257.94117647058823" stroke="#c9d4da" stroke-width="1"/><text x="68" y="263.94117647058823" font-size="17" text-anchor="end" fill="#23384e">−10</text><line x1="80" y1="338.8235294117647" x2="465" y2="338.8235294117647" stroke="#c9d4da" stroke-width="1"/><text x="68" y="344.8235294117647" font-size="17" text-anchor="end" fill="#23384e">−20</text><line x1="80.0" y1="96.17647058823529" x2="465.0" y2="338.8235294117647" stroke="#087f76" stroke-width="3.5"/><circle cx="208.33333333333331" cy="177.05882352941177" r="5" fill="#087f76"/><text x="355" y="124" font-size="19" text-anchor="middle" fill="#23384e">endoergonica</text><text x="205" y="325" font-size="19" text-anchor="middle" fill="#23384e">esoergonica</text><text x="260" y="449" font-size="18" text-anchor="middle" fill="#23384e">ΔH = 20 kJ mol⁻¹; ΔS = 100 J mol⁻¹ K⁻¹</text></g></svg>