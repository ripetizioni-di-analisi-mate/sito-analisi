<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="520" height="430" role="img" aria-labelledby="title desc"><title id="title">Isotopo e carica sono indipendenti</title><desc id="desc">Conteggi per due isotopi del magnesio e uno ione.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#23384e"/></marker></defs><rect width="520" height="430" fill="white"/><g font-family="Arial, sans-serif"><text x="260" y="31" font-size="22" text-anchor="middle" fill="#23384e">Isotopo e carica sono indipendenti</text><rect x="24" y="65" width="472" height="88" rx="8" fill="#f5f7fa" stroke="#b7cbd5" stroke-width="1.5"/><text x="85" y="101" font-size="27" text-anchor="middle" fill="#23384e">²⁴Mg</text><text x="300" y="96" font-size="22" text-anchor="middle" fill="#23384e">12 p⁺     12 n     12 e⁻</text><text x="300" y="128" font-size="18" text-anchor="middle" fill="#23384e">atomo neutro</text><rect x="24" y="170" width="472" height="88" rx="8" fill="#f5f7fa" stroke="#b7cbd5" stroke-width="1.5"/><text x="85" y="206" font-size="27" text-anchor="middle" fill="#23384e">²⁵Mg</text><text x="300" y="201" font-size="22" text-anchor="middle" fill="#23384e">12 p⁺     13 n     12 e⁻</text><text x="300" y="233" font-size="18" text-anchor="middle" fill="#23384e">un neutrone in più</text><rect x="24" y="275" width="472" height="88" rx="8" fill="#f5f7fa" stroke="#b7cbd5" stroke-width="1.5"/><text x="85" y="311" font-size="27" text-anchor="middle" fill="#23384e">²⁴Mg²⁺</text><text x="300" y="306" font-size="22" text-anchor="middle" fill="#23384e">12 p⁺     12 n     10 e⁻</text><text x="300" y="338" font-size="18" text-anchor="middle" fill="#23384e">due elettroni in meno</text><text x="260" y="405" font-size="19" text-anchor="middle" fill="#23384e">Z = protoni; A = protoni + neutroni</text></g></svg>