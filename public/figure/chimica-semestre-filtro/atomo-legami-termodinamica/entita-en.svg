<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="520" height="430" role="img" aria-labelledby="title desc"><title id="title">Molecules and atoms in a sample</title><desc id="desc">One mole of water contains two moles of H and one mole of O.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#23384e"/></marker></defs><g><text x="260" y="31" font-size="22" text-anchor="middle" fill="currentColor">Molecules and atoms in a sample</text><text x="260" y="74" font-size="22" text-anchor="middle" fill="currentColor">1 mol H₂O = N<tspan baseline-shift="sub" font-size="70%">A</tspan> molecules</text><line x1="185" y1="177" x2="250" y2="137" stroke="#23384e" stroke-width="3"/><line x1="270" y1="137" x2="335" y2="177" stroke="#23384e" stroke-width="3"/><circle cx="260" cy="130" r="27" fill="#8053a5"/><text x="260" y="138" font-size="25" text-anchor="middle" fill="white">O</text><circle cx="175" cy="185" r="21" fill="#087f76"/><text x="175" y="193" font-size="23" text-anchor="middle" fill="white">H</text><circle cx="345" cy="185" r="21" fill="#087f76"/><text x="345" y="193" font-size="23" text-anchor="middle" fill="white">H</text><rect x="30" y="240" width="220" height="90" rx="8" fill="#f5f7fa" stroke="#b7cbd5" stroke-width="1.5"/><text x="140" y="275" font-size="21" text-anchor="middle" fill="currentColor">H atoms: 2 mol</text><text x="140" y="308" font-size="22" text-anchor="middle" fill="#087f76">2N<tspan baseline-shift="sub" font-size="70%">A</tspan></text><rect x="270" y="240" width="220" height="90" rx="8" fill="#f5f7fa" stroke="#b7cbd5" stroke-width="1.5"/><text x="380" y="275" font-size="21" text-anchor="middle" fill="currentColor">O atoms: 1 mol</text><text x="380" y="308" font-size="22" text-anchor="middle" fill="#8053a5">N<tspan baseline-shift="sub" font-size="70%">A</tspan></text><text x="260" y="369" font-size="18" text-anchor="middle" fill="currentColor">Counting atoms within water:</text><text x="260" y="395" font-size="17" text-anchor="middle" fill="currentColor">this diagram does not represent dissociation.</text></g></svg>