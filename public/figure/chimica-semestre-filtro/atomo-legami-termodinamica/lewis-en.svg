<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" role="img" aria-labelledby="title desc"><title id="title">Bonds, lone pairs and charge</title><desc id="desc">H-O-O-H with two lone pairs per oxygen and ammonium with four bonds and positive charge.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#23384e"/></marker></defs><rect width="520" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="260" y="31" font-size="22" text-anchor="middle" fill="#23384e">Bonds, lone pairs and charge</text><text x="260" y="68" font-size="18" text-anchor="middle" fill="#23384e">H₂O₂: two bonds and two lone pairs per O</text><text x="90" y="125" font-size="28" text-anchor="middle" fill="#23384e">H</text><text x="200" y="125" font-size="28" text-anchor="middle" fill="#23384e">O</text><text x="320" y="125" font-size="28" text-anchor="middle" fill="#23384e">O</text><text x="430" y="125" font-size="28" text-anchor="middle" fill="#23384e">H</text><line x1="109" y1="115" x2="181" y2="115" stroke="#23384e" stroke-width="3"/><line x1="219" y1="115" x2="301" y2="115" stroke="#23384e" stroke-width="3"/><line x1="339" y1="115" x2="411" y2="115" stroke="#23384e" stroke-width="3"/><circle cx="194" cy="91" r="3" fill="#23384e"/><circle cx="206" cy="91" r="3" fill="#23384e"/><circle cx="194" cy="143" r="3" fill="#23384e"/><circle cx="206" cy="143" r="3" fill="#23384e"/><circle cx="314" cy="91" r="3" fill="#23384e"/><circle cx="326" cy="91" r="3" fill="#23384e"/><circle cx="314" cy="143" r="3" fill="#23384e"/><circle cx="326" cy="143" r="3" fill="#23384e"/><text x="260" y="190" font-size="18" text-anchor="middle" fill="#23384e">NH₄⁺: four bonds, no lone pair on N</text><line x1="260.0" y1="287.0" x2="260.0" y2="254.0" stroke="#23384e" stroke-width="3"/><text x="260" y="243" font-size="27" text-anchor="middle" fill="#23384e">H</text><li