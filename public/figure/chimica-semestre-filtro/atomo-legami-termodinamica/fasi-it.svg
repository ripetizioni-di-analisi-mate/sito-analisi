<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 750" width="520" height="750" role="img" aria-labelledby="title desc"><title id="title">Confronto dei diagrammi di fase</title><desc id="desc">Fusione con pendenza negativa per acqua e positiva per CO2. Un bar è sopra il triplo dell’acqua e sotto quello della CO2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#23384e"/></marker></defs><rect width="520" height="750" fill="white"/><g font-family="Arial, sans-serif"><text x="260" y="31" font-size="22" text-anchor="middle" fill="#23384e">Confronto dei diagrammi di fase</text><text x="260" y="66" font-size="23" text-anchor="middle" fill="#23384e">H₂O</text><line x1="65" y1="300" x2="485" y2="300" stroke="#23384e" stroke-width="3" marker-end="url(#arrow)"/><line x1="65" y1="300" x2="65" y2="80" stroke="#23384e" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="88" font-size="20" text-anchor="middle" fill="#23384e">p</text><text x="485" y="327" font-size="20" text-anchor="middle" fill="#23384e">T</text><path d="M80 295 Q130 276 180 220" stroke="#8053a5" stroke-width="3" fill="none"/><path d="M180 220 Q310 203 422 100" stroke="#087f76" stroke-width="3" fill="none"/><line x1="180" y1="220" x2="130" y2="90" stroke="#326ca8" stroke-width="3"/><circle cx="180" cy="220" r="5" fill="#23384e"/><circle cx="422" cy="100" r="5" fill="#23384e"/><text x="390" y="86" font-size="17" text-anchor="middle" fill="#23384e">critico</text><text x="112" y="145" font-size="18" text-anchor="middle" fill="#23384e">solido</text><text x="273" y="132" font-size="18" text-anchor="middle" fill="#23384e">liquido</text><text x="340" y="260" font-size="19" text-anchor="middle" fill="#23384e">gas</text><line x1="65" y1="185" x2="465" y2="185" stroke="#8898a7" stroke-width="1.5" stroke-dasharray="6 5"/><text x="78" y="178" font-size="16" text-anchor="start" fill="#23384e">1 bar</text><text x="191" y="243" font-size="17" text-anchor="middle" fill="#23384e">triplo</text><text x="260" y="340" font-size="18" text-anchor="middle" fill="#23384e">pₜ ≈ 0,00612 bar</text><text x="260" y="416" font-size="23" text-anchor="middle" fill="#23384e">CO₂</text><line x1="65" y1="650" x2="485" y2="650" stroke="#23384e" stroke-width="3" marker-end="url(#arrow)"/><line x1="65" y1="650" x2="65" y2="430" stroke="#23384e" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="438" font-size="20" text-anchor="middle" fill="#23384e">p</text><text x="485" y="677" font-size="20" text-anchor="middle" fill="#23384e">T</text><path d="M80 645 Q130 626 180 570" stroke="#8053a5" stroke-width="3" fill="none"/><path d="M180 570 Q310 553 422 450" stroke="#087f76" stroke-width="3" fill="none"/><line x1="180" y1="570" x2="228" y2="440" stroke="#326ca8" stroke-width="3"/><circle cx="180" cy="570" r="5" fill="#23384e"/><circle cx="422" cy="450" r="5" fill="#23384e"/><text x="390" y="436" font-size="17" text-anchor="middle" fill="#23384e">critico</text><text x="112" y="519" font-size="18" text-anchor="middle" fill="#23384e">solido</text><text x="273" y="482" font-size="18" text-anchor="middle" fill="#23384e">liquido</text><text x="340" y="610" font-size="19" text-anchor="middle" fill="#23384e">gas</text><line x1="65" y1="625" x2="465" y2="625" stroke="#8898a7" stroke-width="1.5" stroke-dasharray="6 5"/><text x="78" y="618" font-size="16" text-anchor="start" fill="#23384e">1 bar</text><text x="191" y="593" font-size="17" text-anchor="middle" fill="#23384e">triplo</text><text x="260" y="690" font-size="18" text-anchor="middle" fill="#23384e">pₜ ≈ 5,185 bar</text><text x="260" y="729" font-size="18" text-anchor="middle" fill="#23384e">Curve qualitative; assi non in scala.</text></g></svg>