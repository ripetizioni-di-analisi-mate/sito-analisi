<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Henry: temperatura costante</title><desc id="desc">Concentrazione normalizzata c/kH contro pressione parziale; entrambi gli assi hanno la stessa unità di pressione.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><text x="360" y="36" text-anchor="middle" font-size="29" fill="currentColor">Henry: temperatura costante</text><path d="M115 345 L640 345" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M115 345 L115 85" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="100" y="70" text-anchor="middle" font-size="26" fill="currentColor">c / kH (atm)</text><text x="660" y="385" text-anchor="middle" font-size="29" fill="currentColor">p (atm)</text><path d="M115 345 L595 105" stroke="#176d73" stroke-width="4" fill="none"/><path d="M115 340 L115 350" stroke="#176d73" stroke-width="4" fill="none"/><text x="115" y="385" text-anchor="middle" font-size="24" fill="currentColor">0</text><path d="M355 340 L355 350" stroke="#176d73" stroke-width="4" fill="none"/><text x="355" y="385" text-anchor="middle" font-size="24" fill="currentColor">1</text><path d="M110 225 L120 225" stroke="#176d73" stroke-width="4" fill="none"/><text x="85" y="233" text-anchor="middle" font-size="24" fill="currentColor">1</text><path d="M595 340 L595 350" stroke="#176d73" stroke-width="4" fill="none"/><text x="595" y="385" text-anchor="middle" font-size="24" fill="currentColor">2</text><path d="M110 105 L120 105" stroke="#176d73" stroke-width="4" fill="none"/><text x="85" y="113" text-anchor="middle" font-size="24" fill="currentColor">2</text><text x="390" y="130" text-anchor="middle" font-size="31" fill="currentColor">c = kH p</text><text x="360" y="430" text-anchor="middle"