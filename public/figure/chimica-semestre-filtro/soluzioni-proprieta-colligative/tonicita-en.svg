<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 585" role="img" aria-labelledby="title desc"><title id="title">Tonicity depends on permeability</title><desc id="desc">Ideal cell responses in a large external reservoir; qualitative sizes, with no hydrostatic constraints.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><text x="360" y="36" text-anchor="middle" font-size="29" fill="currentColor">Tonicity depends on permeability</text><text x="175" y="105" text-anchor="middle" font-size="24" fill="currentColor">200: retained</text><circle cx="405" cy="97" r="44" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="565" y="107" text-anchor="middle" font-size="23" fill="currentColor">Swelling</text><text x="175" y="220" text-anchor="middle" font-size="24" fill="currentColor">300: retained</text><circle cx="405" cy="212" r="33" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="565" y="222" text-anchor="middle" font-size="23" fill="currentColor">Stable volume</text><text x="175" y="335" text-anchor="middle" font-size="24" fill="currentColor">400: retained</text><circle cx="405" cy="327" r="24" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="565" y="337" text-anchor="middle" font-size="23" fill="currentColor">Shrinkage</text><text x="175" y="450" text-anchor="middle" font-size="24" fill="currentColor">300: permeating urea</text><circle cx="405" cy="442" r="44" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="565" y="442" text-anchor="middle" font-size="23" fill="currentColor">Swelling</text><text x="565" y="472" text-anchor="middle" font-size="21" fill="currentColor">after entry</text><text x="360" y="555" text-anchor="middle" font-size="23" fill="currentColor">External mOsm/L; initially 300 retained inside</text></svg>