<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 455" role="img" aria-labelledby="title desc"><title id="title">Counting independent particles</title><desc id="desc">Glucose gives one particle; NaCl two and CaCl2 three in the ideal complete-dissociation limit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><text x="360" y="36" text-anchor="middle" font-size="29" fill="currentColor">Counting independent particles</text><text x="115" y="115" text-anchor="middle" font-size="29" fill="currentColor">Glucose</text><path d="M210 106 L285 106" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="105" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="480" y="114" text-anchor="middle" font-size="24" fill="currentColor">G</text><text x="115" y="230" text-anchor="middle" font-size="29" fill="currentColor">NaCl</text><path d="M210 221 L285 221" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="420" cy="220" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="420" y="229" text-anchor="middle" font-size="24" fill="currentColor">Na⁺</text><circle cx="555" cy="220" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="555" y="229" text-anchor="middle" font-size="24" fill="currentColor">Cl⁻</text><text x="115" y="345" text-anchor="middle" font-size="29" fill="currentColor">CaCl₂</text><path d="M210 336 L285 336" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="365" cy="335" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="365" y="344" text-anchor="middle" font-size="24" fill="currentColor">Ca²⁺</text><circle cx="490" cy="335" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="490" y="344" text-anchor="middle" font-size="24" fill="currentColor">Cl⁻</text><circle cx="615" cy="335" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="615" y="344" text-anchor="middle" font-size="24" fill="currentColor">Cl⁻</text><text x="360" y="425" text-anchor="middle" font-size="23" fill="currentColor">One starting molecule or formula unit; ideal limit</text></svg>