<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Stessa percentuale, grandezze diverse</title><desc id="desc">I due campioni dello svolto danno il tre per cento secondo definizioni diverse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><text x="360" y="36" text-anchor="middle" font-size="29" fill="currentColor">Stessa percentuale, grandezze diverse</text><rect x="35" y="85" width="650" height="130" rx="12" fill="#dcefed" stroke="#176d73" stroke-width="3"/><rect x="35" y="260" width="650" height="130" rx="12" fill="#dcefed" stroke="#176d73" stroke-width="3"/><text x="360" y="128" text-anchor="middle" font-size="30" fill="currentColor">7.5 g / 250 mL → 3 g / 100 mL</text><text x="360" y="180" text-anchor="middle" font-size="27" fill="currentColor">3% massa-volume</text><text x="360" y="305" text-anchor="middle" font-size="30" fill="currentColor">6 mL / 200 mL → 3 mL / 100 mL</text><text x="360" y="355" text-anchor="middle" font-size="27" fill="currentColor">3% volume-volume</text><text x="360" y="438" text-anchor="middle" font-size="24" fill="currentColor">Tutti i denominatori sono volumi finali di soluzione</text></svg>