<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 585" role="img" aria-labelledby="title desc"><title id="title">La tonicità dipende dalla permeabilità</title><desc id="desc">Risposte qualitative di una cellula ideale in un grande serbatoio esterno, senza vincoli idrostatici.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><text x="360" y="36" text-anchor="middle" font-size="29" fill="currentColor">La tonicità dipende dalla permeabilità</text><text x="175" y="105" text-anchor="middle" font-size="24" fill="currentColor">200: trattenuti</text><circle cx="405" cy="97" r="44" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="565" y="107" text-anchor="middle" font-size="23" fill="currentColor">Rigonfiamento</text><text x="175" y="220" text-anchor="middle" font-size="24" fill="currentColor">300: trattenuti</text><circle cx="405" cy="212" r="33" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="565" y="222" text-anchor="middle" font-size="23" fill="currentColor">Volume stabile</text><text x="175" y="335" text-anchor="middle" font-size="24" fill="currentColor">400: trattenuti</text><circle cx="405" cy="327" r="24" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="565" y="337" text-anchor="middle" font-size="23" fill="currentColor">Raggrinzimento</text><text x="175" y="450" text-anchor="middle" font-size="24" fill="currentColor">300: urea permeante</text><circle cx="405" cy="442" r="44" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="565" y="442" text-anchor="middle" font-size="23" fill="currentColor">Rigonfiamento</text><text x="565" y="472" text-anchor="middle" font-size="21" fill="currentColor">dopo ingresso</text><text x="360" y="555" text-anchor="middle" font-size="23" fill="currentColor">mOsm/L esterni; inizialmente 300 trattenuti dentro</text></svg>