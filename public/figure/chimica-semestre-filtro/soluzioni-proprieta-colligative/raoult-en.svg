<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Raoult: non-volatile solute</title><desc id="desc">Relative solvent pressure increases linearly with solvent mole fraction, from zero to pure solvent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><rect width="720" height="460" fill="white"/><text x="360" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#17313b">Raoult: non-volatile solute</text><path d="M115 345 L640 345" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M115 345 L115 85" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="94" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#17313b">p / p*</text><text x="640" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#17313b">xw</text><path d="M115 345 L595 105" stroke="#176d73" stroke-width="4" fill="none"/><path d="M115 340 L115 350" stroke="#176d73" stroke-width="4" fill="none"/><text x="115" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">0</text><path d="M355.0 340 L355.0 350" stroke="#176d73" stroke-width="4" fill="none"/><text x="355.0" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">0.5</text><path d="M110 225.0 L120 225.0" stroke="#176d73" stroke-width="4" fill="none"/><text x="80" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">0.5</text><path d="M595 340 L595 350" stroke="#176d73" stroke-width="4" fill="none"/><text x="595" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">1</text><path d="M110 105 L120 105" stroke="#176d73" stroke-width="4" fill="none"/><text x="80" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">1</text><text x="390" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#17313b">p / p* = xw</text><text x="360" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">w = solvent; ideal liquid at fixed temperature</text></svg>