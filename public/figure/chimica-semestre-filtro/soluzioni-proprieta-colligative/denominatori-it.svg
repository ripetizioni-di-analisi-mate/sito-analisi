<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" aria-labelledby="title desc"><title id="title">Un campione, due denominatori</title><desc id="desc">Massa molare del glucosio 180 g/mol; massa del solvente e volume finale sono denominatori diversi.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><text x="360" y="36" text-anchor="middle" font-size="29" fill="currentColor">Un campione, due denominatori</text><rect x="40" y="70" width="640" height="75" rx="12" fill="#dcefed" stroke="#176d73" stroke-width="3"/><text x="360" y="116" text-anchor="middle" font-size="25" fill="currentColor">18 g glucosio + 200 g acqua → 210 mL soluzione</text><text x="360" y="185" text-anchor="middle" font-size="29" fill="currentColor">n = 0.100 mol</text><path d="M360 200 L180 245" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M360 200 L540 245" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="30" y="260" width="305" height="125" rx="12" fill="#dcefed" stroke="#176d73" stroke-width="3"/><rect x="385" y="260" width="305" height="125" rx="12" fill="#dcefed" stroke="#176d73" stroke-width="3"/><text x="182" y="300" text-anchor="middle" font-size="28" fill="currentColor">Molalità</text><text x="182" y="345" text-anchor="middle" font-size="27" fill="currentColor">0.100 mol / 0.200 kg</text><text x="537" y="300" text-anchor="middle" font-size="28" fill="currentColor">Molarità</text><text x="537" y="345" text-anchor="middle" font-size="27" fill="currentColor">0.100 mol / 0.210 L</text><text x="360" y="433" text-anchor="middle" font-size="25" fill="currentColor">Massa del solvente ≠ volume finale della soluzione</text></svg>