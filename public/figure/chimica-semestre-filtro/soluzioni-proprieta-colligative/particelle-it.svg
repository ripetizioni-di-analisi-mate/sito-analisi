<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 455" role="img" aria-labelledby="title desc"><title id="title">Contare le particelle indipendenti</title><desc id="desc">Glucosio: una particella; NaCl: due; CaCl2: tre nel limite ideale di dissociazione completa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><rect width="720" height="455" fill="white"/><text x="360" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#17313b">Contare le particelle indipendenti</text><text x="115" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#17313b">Glucosio</text><path d="M210 106 L285 106" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="105" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="480" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">G</text><text x="115" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#17313b">NaCl</text><path d="M210 221 L285 221" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="420" cy="220" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="420" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">Na⁺</text><circle cx="555" cy="220" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="555" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">Cl⁻</text><text x="115" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#17313b">CaCl₂</text><path d="M210 336 L285 336" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="365" cy="335" r="34" fill="#dcefed" stroke="#176d73" stroke-width="2"/><text x="365" y="344" text-