<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Same percentage, different quantities</title><desc id="desc">The two worked samples give three percent by different definitions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><rect width="720" height="470" fill="white"/><text x="360" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#17313b">Same percentage, different quantities</text><rect x="35" y="85" width="650" height="130" rx="12" fill="#dcefed" stroke="#176d73" stroke-width="3"/><rect x="35" y="260" width="650" height="130" rx="12" fill="#dcefed" stroke="#176d73" stroke-width="3"/><text x="360" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#17313b">7.5 g / 250 mL → 3 g / 100 mL</text><text x="360" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#17313b">3% mass–volume</text><text x="360" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#17313b">6 mL / 200 mL → 3 mL / 100 mL</text><text x="360" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#17313b">3% volume–volume</text><text x="360" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17313b">All denominators refer to final solution volumes</text></svg>