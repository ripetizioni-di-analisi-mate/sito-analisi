<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" aria-labelledby="title desc"><title id="title">Initial osmosis: equal pressures</title><desc id="desc">Equal initial volumes and pressures; water moves from four retained particles to eight, not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176d73"/></marker></defs><rect width="720" height="465" fill="white"/><text x="360" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#17313b">Initial osmosis: equal pressures</text><rect x="35" y="90" width="650" height="245" rx="12" fill="#dcefed" stroke="#176d73" stroke-width="3"/><path d="M360 90 L360 335" stroke="#176d73" stroke-width="4" fill="none"/><circle cx="95" cy="145" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="230" cy="150" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="120" cy="270" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="270" cy="265" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="415" cy="135" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="505" cy="140" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="620" cy="150" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="470" cy="225" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="550" cy="215" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="650" cy="245" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="460" cy="290" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><circle cx="580" cy="295" r="10" fill="#ca7545" stroke="#176d73" stroke-width="2"/><path d="M270 205 L445 205" stroke="#176d73" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="300" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#17313b">H₂O</text><text x="195" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#17313b">Fewer particles</text><text x="525" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#17313b">More particles</text><text x="360" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#17313b">Water passes; solute is retained</text></svg>