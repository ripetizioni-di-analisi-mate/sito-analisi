<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 555" role="img" aria-labelledby="title"><title id="title">Aldol: addition and condensation</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087c80"/></marker></defs><rect width="600" height="555" fill="white"/><text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18394c">Aldol: addition and condensation</text><text x="300" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#087c80">2 CH₃–CH=O</text><text x="300" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#18394c">Dilute base; addition conditions</text><path d="M300,163 L300,214" fill="none" stroke="#087c80" stroke-width="3" marker-end="url(#a)"/><text x="300" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#087c80">CH₃–CH(OH)–CH₂–CHO</text><text x="300" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#18394c">3-Hydroxybutanal</text><text x="300" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#18394c">Heat; dehydration conditions</text><path d="M300,372 L300,423" fill="none" stroke="#087c80" stroke-width="3" marker-end="url(#a)"/><text x="300" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#087c80">CH₃–CH=CH–CHO + H₂O</text><text x="300" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#18394c">Four carbons in both organic products</text></svg>