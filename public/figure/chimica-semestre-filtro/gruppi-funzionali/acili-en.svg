><line x1="277" y1="300" x2="277" y2="330" stroke="#355ca0" stroke-width="3"/><text x="300" y="415" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">Amide</text><text x="160" y="525" text-anchor="middle" font-size="29" font-weight="400" fill="currentColor">R</text><text x="270" y="525" text-anchor="middle" font-size="29" font-weight="400" fill="currentColor">C</text><text x="420" y="525" text-anchor="middle" font-size="29" font-weight="400" fill="#087c80">NH₂</text><text x="270" y="455" text-anchor="middle" font-size="29" font-weight="400" fill="#355ca0">O</text><line x1="183" y1="515" x2="246" y2="515" stroke="#18394c" stroke-width="3"/><line x1="293" y1="515" x2="360" y2="515" stroke="#18394c" stroke-width="3"/><line x1="264" y1="470" x2="264" y2="500" stroke="#355ca0" stroke-width="3"/><line x1="277" y1="470" x2="277" y2="500" stroke="#355ca0" stroke-width="3"/><text x="300" y="585" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">Acyl phosphate</text><text x="300" y="695" text-anchor="middle" font-size="28" font-weight="400" fill="#087c80">R–C(=O)–O–P(=O)(O⁻)₂</text><text x="300" y="810" text-anchor="middle" font-size="22" font-weight="400" fill="currentColor">The acyl carbon is bonded to O, S or N</text></svg>