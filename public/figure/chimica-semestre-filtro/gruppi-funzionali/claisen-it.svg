<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" role="img" aria-labelledby="title"><title id="title">Claisen: formazione di un legame C–C</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087c80"/></marker></defs><rect width="600" height="510" fill="white"/><text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18394c">Claisen: formazione di un legame C–C</text><text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#087c80">2 CH₃–C(=O)–O–CH₂CH₃</text><text x="300" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#18394c">1. CH₃CH₂O⁻ / CH₃CH₂OH</text><text x="300" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#18394c">2. Trattamento acido</text><path d="M300,220 L300,275" fill="none" stroke="#087c80" stroke-width="3" marker-end="url(#a)"/><text x="300" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#087c80">CH₃–CO–CH₂–COO–CH₂CH₃</text><text x="300" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#087c80">+ CH₃CH₂OH</text><text x="300" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#18394c">β-Chetoestere + alcol</text><text x="300" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18394c">La base rimuove anche un Hα dal prodotto</text></svg>