<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 525" role="img" aria-labelledby="title"><title id="title">Classify an alcohol</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087c80"/></marker></defs><text x="300" y="38" text-anchor="middle" font-size="27" font-weight="700" fill="currentColor">Classify an alcohol</text><rect x="25" y="70" width="550" height="110" rx="10" fill="#f0f6f7" stroke="#cad9de"/><text x="300" y="113" text-anchor="middle" font-size="29" font-weight="400" fill="#087c80">CH₃–CH₂–OH</text><text x="300" y="154" text-anchor="middle" font-size="23" font-weight="400" fill="currentColor">Primary: one C neighbor</text><rect x="25" y="200" width="550" height="110" rx="10" fill="#f0f6f7" stroke="#cad9de"/><text x="300" y="243" text-anchor="middle" font-size="29" font-weight="400" fill="#087c80">CH₃–CH(OH)–CH₃</text><text x="300" y="284" text-anchor="middle" font-size="23" font-weight="400" fill="currentColor">Secondary: two C neighbors</text><rect x="25" y="330" width="550" height="110" rx="10" fill="#f0f6f7" stroke="#cad9de"/><text x="300" y="373" text-anchor="middle" font-size="29" font-weight="400" fill="#087c80">(CH₃)₃C–OH</text><text x="300" y="414" text-anchor="middle" font-size="23" font-weight="400" fill="currentColor">Tertiary: three C neighbors</text><text x="300" y="495" text-anchor="middle" font-size="23" font-weight="400" fill="currentColor">Count at the carbon bearing OH</text></svg>