<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 605" role="img" aria-labelledby="title"><title id="title">Total pressure is insufficient</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176e59"/></marker></defs><text x="240" y="32" text-anchor="middle" font-size="23" fill="currentColor" font-weight="normal" >Total pressure is insufficient</text><text x="240" y="69" text-anchor="middle" font-size="24" fill="currentColor" font-weight="normal" >N₂O₄(g) ⇌ 2 NO₂(g)</text><rect x="25" y="95" width="430" height="139" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="240" y="125" text-anchor="middle" font-size="21" fill="currentColor" font-weight="bold" >Compression</text><text x="240" y="154" text-anchor="middle" font-size="18" fill="currentColor" font-weight="normal" >Volume halved</text><text x="240" y="189" text-anchor="middle" font-size="24" fill="#2468a0" font-weight="normal" >Q′ = 2K</text><text x="240" y="217" text-anchor="middle" font-size="19" fill="currentColor" font-weight="normal" >Towards N₂O₄</text><rect x="25" y="250" width="430" height="139" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="240" y="280" text-anchor="middle" font-size="21" fill="currentColor" font-weight="bold" >Inert gas: constant V</text><text x="240" y="309" text-anchor="middle" font-size="18" fill="currentColor" font-weight="normal" >Unchanged partial pressures</text><text x="240" y="344" text-anchor="middle" font-size="24" fill="#2468a0" font-weight="normal" >Q′ = K</text><text x="240" y="372" text-anchor="middle" font-size="19" fill="currentColor" font-weight="normal" >No shift</text><rect x="25" y="405" width="430" height="139" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="240" y="435" text-anchor="middle" font-size="21" fill="currentColor" font-weight="bold" >Inert gas: constant total P</text><text x="240" y="464" text-anchor="middle" font-size="18" fill="currentColor" font-weight="normal" >Example: volume doubled</text><text x="240" y="499" text-anchor="middle" font-size="24" fill="#2468a0" font-weight="normal" >Q′ = K/2</text><text x="240" y="527" text-anchor="middle" font-size="19" fill="currentColor" font-weight="normal" >Towards NO₂</text><text x="240" y="580" text-anchor="middle" font-size="18" fill="currentColor" font-weight="normal" >Constant T; ideal gases; before reaction</text></svg>