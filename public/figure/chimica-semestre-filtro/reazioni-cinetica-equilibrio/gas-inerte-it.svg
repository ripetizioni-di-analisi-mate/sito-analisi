<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 605" role="img" aria-labelledby="title"><title id="title">La pressione totale non basta</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176e59"/></marker></defs><rect width="480" height="605" rx="14" fill="#f7faf9"/><text x="240" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#173d35" font-weight="normal" >La pressione totale non basta</text><text x="240" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#173d35" font-weight="normal" >N₂O₄(g) ⇌ 2 NO₂(g)</text><rect x="25" y="95" width="430" height="139" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="240" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#173d35" font-weight="bold" >Compressione</text><text x="240" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#173d35" font-weight="normal" >Volume dimezzato</text><text x="240" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2468a0" font-weight="normal" >Q′ = 2K</text><text x="240" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#173d35" font-weight="normal" >Verso N₂O₄</text><rect x="25" y="250" width="430" height="139" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="240" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#173d35" font-weight="bold" >Inerte: V costante</text><text x="240" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#173d35" font-weight="normal" >Pressioni parziali invariate</text><text x="240" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2468a0" font-weight="normal" >Q′ = K</text><text x="240" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#173d35" font-weight="normal" >Nessuno spostamento</text><rect x="25" y="405" width="430" height="139" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="240" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#173d35" font-weight="bold" >Inerte: P totale costante</text><text x="240" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#173d35" font-weight="normal" >Esempio: volume raddoppiato</text><text x="240" y="499" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2468a0" font-weight="normal" >Q′ = K/2</text><text x="240" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#173d35" font-weight="normal" >Verso NO₂</text><text x="240" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#173d35" font-weight="normal" >T costante; gas ideali; prima della reazione</text></svg>