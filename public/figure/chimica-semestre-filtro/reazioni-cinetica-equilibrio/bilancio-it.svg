<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 565" role="img" aria-labelledby="title"><title id="title">Bilancio e reagente limitante</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176e59"/></marker></defs><text x="240" y="32" text-anchor="middle" font-size="23" fill="currentColor" font-weight="normal" >Bilancio e reagente limitante</text><rect x="40" y="60" width="400" height="100" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="240" y="89" text-anchor="middle" font-size="21" fill="currentColor" font-weight="bold" >Quantità iniziali</text><text x="150" y="130" text-anchor="middle" font-size="24" fill="currentColor" font-weight="normal" >H₂: 3 mol</text><text x="340" y="130" text-anchor="middle" font-size="24" fill="currentColor" font-weight="normal" >O₂: 1 mol</text><line x1="240" y1="166" x2="240" y2="202" stroke="#176e59" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="210" width="400" height="105" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="240" y="241" text-anchor="middle" font-size="21" fill="currentColor" font-weight="bold" >Consumo stechiometrico</text><text x="240" y="285" text-anchor="middle" font-size="24" fill="currentColor" font-weight="normal" >2 mol H₂ + 1 mol O₂</text><line x1="240" y1="320" x2="240" y2="354" stroke="#176e59" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="366" width="205" height="105" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><rect x="245" y="366" width="205" height="105" rx="12" fill="white" stroke="#176e59" stroke-width="1.6"/><text x="132" y="398" text-anchor="middle" font-size="21" fill="currentColor" font-weight="normal" >Prodotto</text><text x="132" y="440" text-anchor="middle" font-size="24" fill="currentColor" font-weight="normal" >2 mol H₂O</text><text x="348" y="398" text-anchor="middle" font-size="21" fill="currentColor" font-weight="normal" >Residuo</text><text x="348" y="440" text-anchor="middle" font-size="24" fill="currentColor" font-weight="normal" >1 mol H₂</text><text x="240" y="512" text-anchor="middle" font-size="20" fill="currentColor" font-weight="normal" >O₂ limita l’avanzamento</text><text x="240" y="540" text-anchor="middle" font-size="22" fill="currentColor" font-weight="normal" >2 H₂ + O₂ → 2 H₂O</text></svg>