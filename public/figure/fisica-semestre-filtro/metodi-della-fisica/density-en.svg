<svg xmlns="http://www.w3.org/2000/svg" width="390" height="505" viewBox="0 0 390 505" role="img" aria-labelledby="title"><title id="title">Same material, same density</title><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#183e58"/></marker></defs><rect width="390" height="505" fill="white"/><g font-family="DejaVu Sans,sans-serif"><text x="195" y="30" text-anchor="middle" font-size="19" fill="#183e58" font-weight="bold">Same material, same density</text><line x1="54.0" y1="355.0" x2="54.0" y2="95.0" stroke="#dbe5eb" stroke-width="1"/><text x="54.0" y="375.0" text-anchor="middle" font-size="12" fill="#183e58">0</text><line x1="113.2" y1="355.0" x2="113.2" y2="95.0" stroke="#dbe5eb" stroke-width="1"/><text x="113.2" y="375.0" text-anchor="middle" font-size="12" fill="#183e58">10</text><line x1="172.4" y1="355.0" x2="172.4" y2="95.0" stroke="#dbe5eb" stroke-width="1"/><text x="172.4" y="375.0" text-anchor="middle" font-size="12" fill="#183e58">20</text><line x1="231.6" y1="355.0" x2="231.6" y2="95.0" stroke="#dbe5eb" stroke-width="1"/><text x="231.6" y="375.0" text-anchor="middle" font-size="12" fill="#183e58">30</text><line x1="290.8" y1="355.0" x2="290.8" y2="95.0" stroke="#dbe5eb" stroke-width="1"/><text x="290.8" y="375.0" text-anchor="middle" font-size="12" fill="#183e58">40</text><line x1="350.0" y1="355.0" x2="350.0" y2="95.0" stroke="#dbe5eb" stroke-width="1"/><text x="350.0" y="375.0" text-anchor="middle" font-size="12" fill="#183e58">50</text><line x1="54.0" y1="355.0" x2="350.0" y2="355.0" stroke="#dbe5eb" stroke-width="1"/><text x="45.0" y="359.0" text-anchor="end" font-size="12" fill="#183e58">0</text><line x1="54.0" y1="303.0" x2="350.0" y2="303.0" stroke="#dbe5eb" stroke-width="1"/><text x="45.0" y="307.0" text-anchor="end" font-size="12" fill="#183e58">20</text><line x1="54.0" y1="251.0" x2="350.0" y2="251.0" stroke="#dbe5eb" stroke-width="1"/><text x="45.0" y="255.0" text-anchor="end" font-size="12" fill="#183e58">40</text><line x1="54.0" y1="199.0" x2="350.0" y2="199.0" stroke="#dbe5eb" stroke-width="1"/><text x="45.0" y="203.0" text-anchor="end" font-size="12" fill="#183e58">60</text><line x1="54.0" y1="147.0" x2="350.0" y2="147.0" stroke="#dbe5eb" stroke-width="1"/><text x="45.0" y="151.0" text-anchor="end" font-size="12" fill="#183e58">80</text><line x1="54.0" y1="95.0" x2="350.0" y2="95.0" stroke="#dbe5eb" stroke-width="1"/><text x="45.0" y="99.0" text-anchor="end" font-size="12" fill="#183e58">100</text><line x1="54.0" y1="355.0" x2="350.0" y2="355.0" stroke="#183e58" stroke-width="2" marker-end="url(#a)"/><line x1="54.0" y1="355.0" x2="54.0" y2="95.0" stroke="#183e58" stroke-width="2" marker-end="url(#a)"/><text x="350" y="398" text-anchor="end" font-size="14" fill="#183e58">V (cm³)</text><text x="15" y="80" text-anchor="start" font-size="14" fill="#183e58">m (g)</text><line x1="54.0" y1="355.0" x2="350.0" y2="95.0" stroke="#087e8b" stroke-width="3"/><circle cx="113.2" cy="303.0" r="4" fill="#c5532e"/><circle cx="290.8" cy="147.0" r="4" fill="#c5532e"/><text x="195" y="442" text-anchor="middle" font-size="17" fill="#183e58">ρ = Δm/ΔV = 2 g/cm³</text><text x="195" y="479" text-anchor="middle" font-size="14" fill="#183e58">Dividing m and V by 4 preserves ρ.</text></g></svg>