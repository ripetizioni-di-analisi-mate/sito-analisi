<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="390" height="496" viewBox="0 0 390 496" role="img" aria-labelledby="title"><title id="title">Braccio della forza</title><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#183e58"/></marker></defs><g><text x="195" y="30" text-anchor="middle" font-size="19" fill="currentColor" font-weight="bold">Braccio della forza</text><text x="195" y="65" text-anchor="middle" font-size="14" fill="currentColor">Vista nel piano; scala geometrica</text><line x1="56" y1="235" x2="256" y2="235" stroke="#087e8b" stroke-width="5"/><circle cx="56" cy="235" r="4" fill="#c5532e"/><line x1="256" y1="235" x2="311" y2="139.7372" stroke="#c5532e" stroke-width="3" marker-end="url(#a)"/><line x1="191" y1="347.5833" x2="326" y2="113.7564" stroke="#718899" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="56" y1="235" x2="206" y2="321.60254" stroke="#183e58" stroke-width="2" stroke-dasharray="5 4"/><text x="156" y="219" text-anchor="middle" font-size="16" fill="#087e8b">r=0,25 m</text><text x="346" y="128" text-anchor="middle" font-size="17" fill="#c5532e">F</text><text x="113" y="301" text-anchor="middle" font-size="17" fill="currentColor">b</text><text x="302" y="218" text-anchor="middle" font-size="15" fill="currentColor">60°</text><text x="195" y="394" text-anchor="middle" font-size="17" fill="currentColor">b=r sin 60° ≈0,217 m</text><text x="195" y="432" text-anchor="middle" font-size="18" fill="currentColor">|τ|=Fb</text><text x="195" y="468" text-anchor="middle" font-size="14" fill="currentColor">b è perpendicolare alla retta d’azione.</text></g></svg>