<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="390" height="472" viewBox="0 0 390 472" role="img" aria-labelledby="title"><title id="title">From edge to volume</title><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#183e58"/></marker></defs><g><text x="195" y="30" text-anchor="middle" font-size="19" fill="currentColor" font-weight="bold">From edge to volume</text><text x="195" y="66" text-anchor="middle" font-size="16" fill="currentColor">Each edge: 1 cm = 0.01 m</text><g transform="translate(0,40)"><line x1="83" y1="257" x2="239" y2="257" stroke="#087e8b" stroke-width="2.5"/><line x1="239" y1="257" x2="239" y2="101" stroke="#087e8b" stroke-width="2.5"/><line x1="239" y1="101" x2="83" y2="101" stroke="#087e8b" stroke-width="2.5"/><line x1="83" y1="101" x2="83" y2="257" stroke="#087e8b" stroke-width="2.5"/><line x1="239" y1="257" x2="291" y2="221" stroke="#087e8b" stroke-width="2.5"/><line x1="239" y1="101" x2="291" y2="65" stroke="#087e8b" stroke-width="2.5"/><line x1="83" y1="101" x2="135" y2="65" stroke="#087e8b" stroke-width="2.5"/><line x1="135" y1="65" x2="291" y2="65" stroke="#087e8b" stroke-width="2.5"/><line x1="291" y1="65" x2="291" y2="221" stroke="#087e8b" stroke-width="2.5"/><line x1="291" y1="221" x2="239" y2="257" stroke="#087e8b" stroke-width="2.5"/><text x="160" y="285" text-anchor="middle" font-size="16" fill="currentColor">1 cm</text><text x="317" y="162" text-anchor="middle" font-size="16" fill="currentColor">1 cm</text><text x="270" y="257" text-anchor="middle" font-size="14" fill="currentColor">1 cm</text><text x="195" y="330" text-anchor="middle" font-size="18" fill="currentColor">V=(0.01 m)³=10⁻⁶ m³</text><text x="195" y="367" text-anchor="middle" font-size="18" fill="currentColor">1 cm³ = 1 mL</text><text x="195" y="405" text-anchor="middle" font-size="15" fill="currentColor">The prefix is cubed.</text></g></g></svg>