<svg xmlns="http://www.w3.org/2000/svg" id="disegno" width="390" height="108" viewBox="0 0 390 108" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a power of ten</title>
  <desc id="desc">The threshold between 10⁻⁶ m and 10⁻⁵ m is their geometric mean. Equal distances on the scale correspond to equal ratios.</desc>
  <text x="27" y="19" font-size="18" fill="var(--inchiostro-2, #59645f)">Length (m)</text>
  <g stroke="currentColor" stroke-width="1.65" fill="none">
    <path d="M50 58 H368 M363 55 L368 58 L363 61"/>
    <path d="M50 52 V64 M200 50 V66 M350 52 V64"/>
  </g>
  <g fill="var(--c-definizione, #2f6f68)">
    <circle cx="140.308999" cy="58" r="4"/>
    <circle cx="283.445375" cy="58" r="4"/>
    <g font-size="20" text-anchor="middle">
      <text x="140.308999" y="43">2 · 10⁻⁶</text>
      <text x="283.445375" y="43">6 · 10⁻⁶</text>
    </g>
  </g>
  <g fill="currentColor" font-size="20" text-anchor="middle">
    <text x="50" y="87">10⁻⁶</text>
    <text x="200" y="87">√10 · 10⁻⁶</text>
    <text x="350" y="87">10⁻⁵</text>
  </g>
</svg>
