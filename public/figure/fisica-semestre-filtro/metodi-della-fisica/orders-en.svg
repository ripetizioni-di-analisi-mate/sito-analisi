<svg xmlns="http://www.w3.org/2000/svg" width="390" height="385" viewBox="0 0 390 385" role="img" aria-labelledby="title"><title id="title">Choosing a power of ten</title><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#183e58"/></marker></defs><rect width="390" height="385" fill="white"/><g font-family="DejaVu Sans,sans-serif"><text x="195" y="30" text-anchor="middle" font-size="19" fill="#183e58" font-weight="bold">Choosing a power of ten</text><text x="195" y="65" text-anchor="middle" font-size="14" fill="#183e58">Logarithmic scale; length in m</text><line x1="50" y1="156" x2="350" y2="156" stroke="#183e58" stroke-width="2" marker-end="url(#a)"/><line x1="50.0" y1="144" x2="50.0" y2="168" stroke="#183e58" stroke-width="2"/><text x="50.0" y="193" text-anchor="middle" font-size="14" fill="#183e58">10⁻⁶</text><line x1="200.0" y1="144" x2="200.0" y2="168" stroke="#183e58" stroke-width="2"/><text x="200.0" y="193" text-anchor="middle" font-size="14" fill="#183e58">√10 ×10⁻⁶</text><line x1="350.0" y1="144" x2="350.0" y2="168" stroke="#183e58" stroke-width="2"/><text x="350.0" y="193" text-anchor="middle" font-size="14" fill="#183e58">10⁻⁵</text><circle cx="140.30899869919438" cy="156" r="4" fill="#c5532e"/><text x="140.30899869919438" y="125" text-anchor="middle" font-size="14" fill="#c5532e">2 ×10⁻⁶</text><circle cx="283.4453751150931" cy="156" r="4" fill="#c5532e"/><text x="283.4453751150931" y="125" text-anchor="middle" font-size="14" fill="#c5532e">6 ×10⁻⁶</text><text x="195" y="255" text-anchor="middle" font-size="16" fill="#183e58">Boundary: geometric mean</text><text x="195" y="292" text-anchor="middle" font-size="16" fill="#183e58">√(10⁻⁶ ×10⁻⁵)=√10 ×10⁻⁶</text><text x="195" y="333" text-anchor="middle" font-size="14" fill="#183e58">Equal distances on the graph,</text><text x="195" y="355" text-anchor="middle" font-size="14" fill="#183e58">equal ratios between values.</text></g></svg>