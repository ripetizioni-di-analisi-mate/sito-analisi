<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="390" height="472" viewBox="0 0 390 472" role="img" aria-labelledby="title"><title id="title">Projection and area</title><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#183e58"/></marker></defs><g><text x="195" y="30" text-anchor="middle" font-size="19" fill="currentColor" font-weight="bold">Projection and area</text><text x="195" y="66" text-anchor="middle" font-size="16" fill="currentColor">a=(4;0),  b=(2;3)</text><polygon points="67.000,285.000 239.000,285.000 325.000,156.000 153.000,156.000" stroke="#718899" stroke-width="2" fill="#edf5f6"/><line x1="67" y1="285" x2="239" y2="285" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><line x1="67" y1="285" x2="153" y2="156" stroke="#c5532e" stroke-width="3" marker-end="url(#a)"/><line x1="153" y1="156" x2="153" y2="285" stroke="#718899" stroke-width="1.5" stroke-dasharray="5 4"/><text x="153" y="311" text-anchor="middle" font-size="16" fill="#087e8b">4</text><text x="129" y="216" text-anchor="middle" font-size="16" fill="#c5532e">b</text><text x="178" y="254" text-anchor="middle" font-size="16" fill="currentColor">3</text><text x="111" y="329" text-anchor="middle" font-size="15" fill="currentColor">2</text><text x="195" y="370" text-anchor="middle" font-size="18" fill="currentColor">a · b = 4 ×2 = 8</text><text x="195" y="407" text-anchor="middle" font-size="18" fill="currentColor">|a × b| = 4 ×3 = 12</text><text x="195" y="446" text-anchor="middle" font-size="14" fill="currentColor">a × b: towards +z, out of the page</text></g></svg>