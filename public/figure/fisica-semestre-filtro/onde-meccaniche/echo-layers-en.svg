<svg xmlns="http://www.w3.org/2000/svg" width="390" height="570" viewBox="0 0 390 570" role="img" aria-labelledby="title"><title id="title">Echo through two layers</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#163b56"/></marker></defs><rect width="390" height="570" fill="white"/><g font-family="DejaVu Sans,sans-serif"><text x="195" y="29" font-size="19" text-anchor="middle" fill="#163b56" font-weight="bold">Echo through two layers</text><text x="195" y="63" font-size="14" text-anchor="middle" fill="#163b56" font-weight="normal">Normal incidence; straight path</text><rect x="54" y="91" width="282" height="126" fill="#e1f1f3"/><rect x="54" y="217" width="282" height="147" fill="#fff0e8"/><line x1="54" y1="217" x2="336" y2="217" stroke="#728796" stroke-width="2"/><line x1="54" y1="365" x2="336" y2="365" stroke="#163b56" stroke-width="5"/><text x="84" y="110" font-size="15" text-anchor="middle" fill="#163b56" font-weight="normal">1</text><text x="84" y="241" font-size="15" text-anchor="middle" fill="#163b56" font-weight="normal">2</text><text x="195" y="134" font-size="16" text-anchor="middle" fill="#163b56" font-weight="normal">d₁=1.5 cm</text><text x="195" y="164" font-size="16" text-anchor="middle" fill="#163b56" font-weight="normal">v₁=1500 m/s</text><text x="195" y="263" font-size="16" text-anchor="middle" fill="#163b56" font-weight="normal">d₂=?</text><text x="195" y="293" font-size="16" text-anchor="middle" fill="#163b56" font-weight="normal">v₂=1600 m/s</text><line x1="115" y1="99" x2="115" y2="354" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><line x1="275" y1="354" x2="275" y2="99" stroke="#c64c2a" stroke-width="3" marker-end="url(#arrow)"/><text x="195" y="395" font-size="15" text-anchor="middle" fill="#163b56" font-weight="normal">Bottom reflector</text><text x="195" y="434" font-size="16" text-anchor="middle" fill="#163b56" font-weight="normal">Measured total time: 60 μs</text><text x="195" y="473" font-size="18" text-anchor="middle" fill="#163b56" font-weight="normal">Δt=2(d₁/v₁+d₂/v₂)</text><text x="195" y="512" font-size="15" text-anchor="middle" fill="#163b56" font-weight="normal">Add times, not speeds</text><text x="195" y="545" font-size="13" text-anchor="middle" fill="#163b56" font-weight="normal">Diagram not to scale</text></g></svg>