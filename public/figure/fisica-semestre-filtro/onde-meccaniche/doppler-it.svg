<svg xmlns="http://www.w3.org/2000/svg" width="390" height="505" viewBox="0 0 390 505" role="img" aria-labelledby="title"><title id="title">Sorgente in movimento</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#163b56"/></marker></defs><rect width="390" height="505" fill="white"/><g font-family="DejaVu Sans,sans-serif"><text x="195" y="29" font-size="19" text-anchor="middle" fill="#163b56" font-weight="bold">Sorgente in movimento</text><text x="195" y="60" font-size="15" text-anchor="middle" fill="#163b56" font-weight="normal">Mezzo fermo; uₛ=0,30 v</text><circle cx="145" cy="209" r="120" stroke="#087f8c" stroke-width="2" fill="none"/><circle cx="145" cy="209" r="2" stroke="#728796" stroke-width="2" fill="#728796"/><circle cx="157" cy="209" r="80" stroke="#087f8c" stroke-width="2" fill="none"/><circle cx="157" cy="209" r="2" stroke="#728796" stroke-width="2" fill="#728796"/><circle cx="169" cy="209" r="40" stroke="#087f8c" stroke-width="2" fill="none"/><circle cx="169" cy="209" r="2" stroke="#728796" stroke-width="2" fill="#728796"/><circle cx="181" cy="209" r="5" stroke="#c64c2a" stroke-width="2" fill="#c64c2a"/><line x1="185" y1="209" x2="223" y2="209" stroke="#163b56" stroke-width="2" marker-end="url(#arrow)"/><text x="196" y="192" font-size="15" text-anchor="middle" fill="#163b56" font-weight="normal">uₛ</text><text x="181" y="235" font-size="14" text-anchor="middle" fill="#c64c2a" font-weight="normal">S</text><text x="60" y="369" font-size="15" text-anchor="middle" fill="#163b56" font-weight="normal">dietro</text><text x="302" y="369" font-size="15" text-anchor="middle" fill="#163b56" font-weight="normal">davanti</text><text x="195" y="410" font-size="16" text-anchor="middle" fill="#163b56" font-weight="normal">λ (dietro)=(v+uₛ)T</text><text x="195" y="442" font-size="16" text-anchor="middle" fill="#163b56" font-weight="normal">λ (davanti)=(v−uₛ)T</text><text x="195" y="480" font-size="14" text-anchor="middle" fill="#163b56" font-weight="normal">Ogni fronte viaggia a v nel mezzo.</text></g></svg>