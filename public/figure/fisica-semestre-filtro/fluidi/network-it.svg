<svg xmlns="http://www.w3.org/2000/svg" width="640" height="525" viewBox="0 0 640 525" role="img" aria-labelledby="title"><title id="title">Resistenze in serie e parallelo</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/></marker></defs><rect width="640" height="525" fill="white"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="27" text-anchor="middle" fill="#17324d">Resistenze idrauliche</text><text x="320" y="85" font-size="23" text-anchor="middle" fill="#17324d">Serie: stessa Q, cadute sommate</text><line x1="70" y1="145" x2="570" y2="145" stroke="#17324d" stroke-width="3" marker-end="url(#arr)"/><rect x="170" y="120" width="105" height="50" fill="#e8f4ee" stroke="#168575" stroke-width="2"/><rect x="355" y="120" width="105" height="50" fill="#e8f4ee" stroke="#168575" stroke-width="2"/><text x="222" y="153" font-size="25" text-anchor="middle" fill="#17324d">R₁</text><text x="407" y="153" font-size="25" text-anchor="middle" fill="#17324d">R₂</text><text x="80" y="126" font-size="23" text-anchor="middle" fill="#17324d">A</text><text x="560" y="126" font-size="23" text-anchor="middle" fill="#17324d">B</text><text x="320" y="208" font-size="26" text-anchor="middle" fill="#17324d">Rₑq = R₁ + R₂</text><text x="320" y="265" font-size="23" text-anchor="middle" fill="#17324d">Parallelo: stessa Δp, portate sommate</text><path d="M80 370 H140 V320 H500 V370 H560 M140 370 V420 H500 V370" fill="none" stroke="#17324d" stroke-width="3"/><rect x="260" y="295" width="120" height="50" fill="#e8f4ee" stroke="#168575" stroke-width="2"/><text x="320" y="329" font-size="25" text-anchor="middle" fill="#17324d">R₁</text><rect x="260" y="395" width="120" height="50" fill="#e8f4ee" stroke="#168575" stroke-width="2"/><text x="320" y="429" font-size="25" text-anchor="middle" fill="#17324d">R₂</text><circle cx="140" cy="370" r="5" fill="#17324d" stroke="#17324d" stroke-width="3"/><circle cx="500" cy="370" r="5" fill="#17324d" stroke="#17324d" stroke-width="3"/><text x="78" y="355" font-size="23" text-anchor="middle" fill="#17324d">A</text><text x="562" y="355" font-size="23" text-anchor="middle" fill="#17324d">B</text><text x="320" y="488" font-size="26" text-anchor="middle" fill="#17324d">1/Rₑq = 1/R₁ + 1/R₂</text></g></svg>
