<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">Areas and speeds in continuity</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/></marker></defs><g><text x="320" y="38" font-size="27" text-anchor="middle" fill="currentColor">Continuity: area × mean speed</text><text x="320" y="84" font-size="22" text-anchor="middle" fill="currentColor">Same flow rate; incompressible fluid</text><circle cx="170" cy="210" r="88" fill="#dff2fc" stroke="#1477ad" stroke-width="3"/><circle cx="475" cy="210" r="44" fill="#dff2fc" stroke="#1477ad" stroke-width="3"/><line x1="82" y1="210" x2="258" y2="210" stroke="#17324d" stroke-width="2"/><line x1="431" y1="210" x2="519" y2="210" stroke="#17324d" stroke-width="2"/><text x="170" y="200" font-size="23" text-anchor="middle" fill="currentColor">D₁ = 2D₂</text><text x="475" y="200" font-size="23" text-anchor="middle" fill="currentColor">D₂</text><text x="170" y="335" font-size="25" text-anchor="middle" fill="currentColor">A₁ = 4A₂</text><text x="475" y="335" font-size="25" text-anchor="middle" fill="currentColor">A₂</text><line x1="120" y1="385" x2="165" y2="385" stroke="#17324d" stroke-width="3" marker-end="url(#arr)"/><line x1="385" y1="385" x2="565" y2="385" stroke="#17324d" stroke-width="3" marker-end="url(#arr)"/><text x="170" y="427" font-size="25" text-anchor="middle" fill="currentColor">v̄₁</text><text x="475" y="427" font-size="25" text-anchor="middle" fill="currentColor">v̄₂ = 4v̄₁</text></g></svg>
