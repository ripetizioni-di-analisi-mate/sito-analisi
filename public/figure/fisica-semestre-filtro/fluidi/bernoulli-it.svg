<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" role="img" aria-labelledby="title"><title id="title">Bilancio energetico di Bernoulli</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/></marker></defs><g><text x="320" y="38" font-size="27" text-anchor="middle" fill="currentColor">Bernoulli: quota costante</text><text x="320" y="77" font-size="22" text-anchor="middle" fill="currentColor">ρ = 1000 kg/m³; totale = 20,5 kPa</text><rect x="130" y="165" width="130" height="220" fill="#dff2fc" stroke="#1477ad" stroke-width="2"/><rect x="130" y="159.5" width="130" height="5.5" fill="#f3b66e" stroke="#d97706" stroke-width="2"/><text x="195" y="275.0" font-size="24" text-anchor="middle" fill="currentColor">20 kPa</text><text x="195" y="118" font-size="22" text-anchor="middle" fill="currentColor">0,5 kPa</text><line x1="195" y1="125" x2="195" y2="162.25" stroke="#17324d" stroke-width="1"/><text x="195" y="425" font-size="23" text-anchor="middle" fill="currentColor">v = 1 m/s</text><rect x="380" y="209" width="130" height="176" fill="#dff2fc" stroke="#1477ad" stroke-width="2"/><rect x="380" y="159.5" width="130" height="49.5" fill="#f3b66e" stroke="#d97706" stroke-width="2"/><text x="445" y="297.0" font-size="24" text-anchor="middle" fill="currentColor">16 kPa</text><text x="445" y="118" font-size="22" text-anchor="middle" fill="currentColor">4,5 kPa</text><line x1="445" y1="125" x2="445" y2="184.25" stroke="#17324d" stroke-width="1"/><text x="445" y="425" font-size="23" text-anchor="middle" fill="currentColor">v = 3 m/s</text><rect x="103" y="452" width="20" height="15" fill="#dff2fc" stroke="#1477ad" stroke-width="2"/><text x="133" y="467" font-size="21" text-anchor="start" fill="currentColor">p statica</text><rect x="350" y="452" width="20" height="15" fill="#f3b66e" stroke="#d97706" stroke-width="2"/><text x=