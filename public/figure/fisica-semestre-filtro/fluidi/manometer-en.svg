<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" role="img" aria-labelledby="title"><title id="title">Oil and water in a U-tube</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/></marker></defs><rect width="640" height="510" fill="white"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="27" text-anchor="middle" fill="#17324d">Manometer: two liquids</text><path d="M152 260 H212 V370 H430 V107 H490 V400 H152 Z" fill="#dff2fc" stroke="#1477ad" stroke-width="0"/><rect x="152" y="80" width="60" height="180" fill="#f9cf8c" stroke="none" stroke-width="2"/><path d="M152 55 V400 H490 V55 M212 55 V370 H430 V55" fill="none" stroke="#17324d" stroke-width="3"/><line x1="152" y1="80" x2="212" y2="80" stroke="#d97706" stroke-width="3"/><line x1="152" y1="260" x2="212" y2="260" stroke="#d97706" stroke-width="3"/><line x1="430" y1="107" x2="490" y2="107" stroke="#1477ad" stroke-width="3"/><line x1="130" y1="260" x2="520" y2="260" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/><text x="182" y="160" font-size="22" text-anchor="middle" fill="#17324d">oil</text><text x="460" y="220" font-size="20" text-anchor="middle" fill="#17324d">water</text><line x1="120" y1="80" x2="120" y2="260" stroke="#17324d" stroke-width="2"/><line x1="112" y1="80" x2="128" y2="80" stroke="#17324d" stroke-width="3"/><line x1="112" y1="260" x2="128" y2="260" stroke="#17324d" stroke-width="3"/><text x="108" y="180" font-size="22" text-anchor="end" fill="#17324d">12.0 cm</text><line x1="520" y1="107" x2="520" y2="260" stroke="#17324d" stroke-width="2"/><line x1="512" y1="107" x2="528" y2="107" stroke="#17324d" stroke-width="3"/><line x1="512" y1="260" x2="528" y2="260" stroke="#17324d" stroke-width="3"/><text x="532" y="188" font-size="22" text-anchor="start" fill="#17324d">10.2 cm</text><circle cx="182" cy="260" r="4" fill="#17324d" stroke="#17324d" stroke-width="3"/><circle cx="460" cy="260" r="4" fill="#17324d" stroke="#17324d" stroke-width="3"/><text x="182" y="295" font-size="23" text-anchor="middle" fill="#17324d">A</text><text x="460" y="295" font-size="23" text-anchor="middle" fill="#17324d">B</text><text x="320" y="443" font-size="22" text-anchor="middle" fill="#17324d">ρₒ = 850 kg/m³; ρₐ = 1000 kg/m³</text><text x="320" y="481" font-size="25" text-anchor="middle" fill="#17324d">p(A) = p(B)  →  ρₒhₒ = ρₐhₐ</text></g></svg>
