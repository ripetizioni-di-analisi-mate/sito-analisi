<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="640" height="615" viewBox="0 0 640 615" role="img" aria-labelledby="title"><title id="title">Curvatures and interfaces</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/></marker></defs><g><text x="320" y="38" font-size="27" text-anchor="middle" fill="currentColor">Curvatures and interfaces</text><line x1="320" y1="65" x2="320" y2="590" stroke="#cbd5e1" stroke-width="1"/><line x1="35" y1="330" x2="605" y2="330" stroke="#cbd5e1" stroke-width="1"/><text x="160" y="92" font-size="22" text-anchor="middle" fill="currentColor">Plane: one interface</text><line x1="65" y1="175" x2="255" y2="175" stroke="#1477ad" stroke-width="5"/><text x="160" y="244" font-size="24" text-anchor="middle" fill="currentColor">R₁, R₂ → ∞</text><text x="160" y="290" font-size="26" text-anchor="middle" fill="currentColor">Δp = 0</text><text x="480" y="92" font-size="22" text-anchor="middle" fill="currentColor">Cylinder: one interface</text><ellipse cx="480" cy="145" rx="55" ry="20" fill="#dff2fc" stroke="#1477ad" stroke-width="3"/><line x1="425" y1="145" x2="425" y2="205" stroke="#1477ad" stroke-width="3"/><line x1="535" y1="145" x2="535" y2="205" stroke="#1477ad" stroke-width="3"/><ellipse cx="480" cy="205" rx="55" ry="20" fill="none" stroke="#1477ad" stroke-width="3"/><text x="480" y="244" font-size="24" text-anchor="middle" fill="currentColor">R₁ = r, R₂ → ∞</text><text x="480" y="290" font-size="26" text-anchor="middle" fill="currentColor">Δp = γ/r</text><text x="160" y="365" font-size="22" text-anchor="middle" fill="currentColor">Sphere: one interface</text><circle cx="160" cy="440" r="49" fill="#dff2fc" stroke="#1477ad" stroke-width="3"/><line x1="160" y1="440" x2="209" y2="440" stroke="#17324d" stroke-width="2"/><text x="184" y="430" font-size="22" text-anchor="middle" fill="currentColor">r</text><text x="160" y="535" font-size="24" text-anchor="middle" fill="currentColor">R₁ = R₂ = r</text><text x="160" y="580" font-size="26" text-anchor="middle" fill="currentColor">Δp = 2γ/r</text><text x="480" y="365" font-size="22" text-anchor="middle" fill="currentColor">Soap: two interfaces</text><circle cx="480" cy="440" r="52" fill="white" stroke="#1477ad" stroke-width="3"/><circle cx="480" cy="440" r="45" fill="white" stroke="#d97706" stroke-width="3"/><text x="480" y="535" font-size="24" text-anchor="middle" fill="currentColor">Thin film</text><text x="480" y="580" font-size="26" text-anchor="middle" fill="currentColor">Δp ≈ 4γ/r</text></g></svg>
