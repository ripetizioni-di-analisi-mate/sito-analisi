<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">Equilibrio del cubo galleggiante</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/></marker></defs><g><text x="320" y="38" font-size="27" text-anchor="middle" fill="currentColor">Galleggiamento: Fₐ = mg</text><rect x="80" y="192" width="480" height="215" fill="#dff2fc" stroke="none" stroke-width="2"/><line x1="80" y1="192" x2="560" y2="192" stroke="#1477ad" stroke-width="3"/><rect x="230" y="120" width="180" height="180" fill="#f9cf8c" stroke="#17324d" stroke-width="2"/><line x1="320" y1="225" x2="320" y2="335" stroke="#17324d" stroke-width="4" marker-end="url(#arr)"/><text x="347" y="340" font-size="24" text-anchor="start" fill="currentColor">mg</text><line x1="320" y1="225" x2="320" y2="115" stroke="#168575" stroke-width="4" marker-end="url(#arr)"/><text x="345" y="138" font-size="26" text-anchor="start" fill="currentColor">Fₐ</text><line x1="210" y1="192" x2="210" y2="300" stroke="#17324d" stroke-width="2"/><line x1="202" y1="192" x2="218" y2="192" stroke="#17324d" stroke-width="3"/><line x1="202" y1="300" x2="218" y2="300" stroke="#17324d" stroke-width="3"/><text x="187" y="245" font-size="25" text-anchor="end" fill="currentColor">60%</text><text x="320" y="88" font-size="23" text-anchor="middle" fill="currentColor">ρ corpo / ρ acqua = 0,60</text><text x="320" y="445" font-size="23" text-anchor="middle" fill="currentColor">Il volume immerso determina la spinta.</text></g></svg>
