<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">Moto circolare uniforme</title><desc id="desc">Raggio0,80m, velocità4m/s tangente, accelerazione20m/s² verso il centro.</desc>
<defs><marker id="a-ink" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#17324d"/></marker><marker id="a-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1767a5"/></marker><marker id="a-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087f75"/></marker><marker id="a-orange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b35112"/></marker><marker id="a-grid" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#dce5eb"/></marker><marker id="a-muted" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#526574"/></marker></defs>

<g fill="#17324d">
<text x="390.00" y="40.00" font-size="26" text-anchor="middle" fill="currentColor" font-weight="bold">Moto circolare uniforme</text>
<circle cx="300.000" cy="280.000" r="150.000" fill="#fff" stroke="#526574" stroke-width="2"/>
<circle cx="300.000" cy="280.000" r="4.000" fill="#17324d" stroke="#17324d" stroke-width="2"/>
<text x="278.00" y="310.00" font-size="23" text-anchor="start" fill="currentColor" font-weight="normal">O</text>
<line x1="300.000" y1="280.000" x2="450.000" y2="280.000" stroke="#526574" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="450.000" cy="280.000" r="7.000" fill="#1767a5" stroke="#1767a5" stroke-width="2"/>
<line x1="450.000" y1="280.000" x2="450.000" y2="100.000" stroke="#1767a5" stroke-width="4" marker-end="url(#a-blue)"/>
<text x="475.00" y="120.00" font-size="24" text-anchor="start" fill="#1767a5" font-weight="normal">v = 4 m/s</text>
<line x1="450.000" y1="280.000" x2="340.000" y2="280.000" stroke="#b35112" stroke-width="4" marker-end="url(#a-orange)"/>
<text x="360.00" y="245.00" font-size="24" text-anchor="middle" fill="#b35112" font-weight="normal">a = 20 m/s²</text>
<text x="360.00" y="325.00" font-size="23" text-anchor="middle" fill="currentColor" font-weight="normal">r = 0,80 m</text>
<text x="390.00" y="485.00" font-size="24" text-anchor="middle" fill="currentColor" font-weight="normal">Velocità tangente • accelerazione radiale</text>
</g></svg>