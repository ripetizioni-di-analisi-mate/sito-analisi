<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Impulse and average force</title><desc id="desc">Triangular force pulse lasting0.10s, peak100N, mean50N and area5Ns.</desc>
<defs><marker id="a-ink" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#17324d"/></marker><marker id="a-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#1767a5"/></marker><marker id="a-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087f75"/></marker><marker id="a-orange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b35112"/></marker><marker id="a-grid" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#dce5eb"/></marker><marker id="a-muted" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#526574"/></marker></defs>

<g fill="#17324d">
<text x="390.00" y="40.00" font-size="26" text-anchor="middle" fill="currentColor" font-weight="bold">Impulse and average force</text>
<line x1="100.000" y1="90.000" x2="100.000" y2="420.000" stroke="#dce5eb" stroke-width="1"/>
<text x="100.00" y="450.00" font-size="22" text-anchor="middle" fill="currentColor" font-weight="normal">0</text>
<line x1="360.870" y1="90.000" x2="360.870" y2="420.000" stroke="#dce5eb" stroke-width="1"/>
<text x="360.87" y="450.00" font-size="22" text-anchor="middle" fill="currentColor" font-weight="normal">0.05</text>
<line x1="621.739" y1="90.000" x2="621.739" y2="420.000" stroke="#dce5eb" stroke-width="1"/>
<text x="621.74" y="450.00" font-size="22" text-anchor="middle" fill="currentColor" font-weight="normal">0.1</text>
<line x1="100.000" y1="420.000" x2="700.000" y2="420.000" stroke="#dce5eb" stroke-width="1"/>
<text x="85.00" y="427.00" font-size="22" text-anchor="end" fill="currentColor" font-weight="normal">0</text>
<line x1="100.000" y1="270.000" x2="700.000" y2="270.000" stroke="#dce5eb" stroke-width="1"/>
<text x="85.00" y="277.00" font-size="22" text-anchor="end" fill="currentColor" font-weight="normal">50</text>
<line x1="100.000" y1="120.000" x2="700.000" y2="120.000" stroke="#dce5eb" stroke-width="1"/>
<text x="85.00" y="127.00" font-size="22" text-anchor="end" fill="currentColor" font-weight="normal">100</text>
<line x1="100.000" y1="420.000" x2="720.000" y2="420.000" stroke="#17324d" stroke-width="2" marker-end="url(#a-ink)"/>
<line x1="100.000" y1="425.000" x2="100.000" y2="75.000" stroke="#17324d" stroke-width="2" marker-end="url(#a-ink)"/>
<text x="728.00" y="450.00" font-size="22" text-anchor="end" fill="currentColor" font-weight="normal">t (s)</text>
<text x="90.00" y="62.00" font-size="22" text-anchor="start" fill="currentColor" font-weight="normal">Fₓ (N)</text>
<polygon points="100.000,420.000 360.870,120.000 621.739,420.000" stroke="#1767a5" stroke-width="3" fill="#e2edf8" stroke-linejoin="round"/>
<line x1="100.000" y1="270.000" x2="621.739" y2="270.000" stroke="#b35112" stroke-width="3" stroke-dasharray="8 6"/>
<text x="381.74" y="348.00" font-size="25" text-anchor="middle" fill="#1767a5" font-weight="normal">J = 5 N s</text>
<text x="390.00" y="490.00" font-size="25" text-anchor="middle" fill="#b35112" font-weight="normal">Average force = 50 N</text>
</g></svg>