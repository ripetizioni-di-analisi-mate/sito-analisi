<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Centre of mass of two points</title><desc id="desc">2kg at0m and1kg at3m: centre of mass at1m.</desc>
