<svg xmlns="http://www.w3.org/2000/svg" width="380" height="375" viewBox="0 0 380 375" role="img" aria-labelledby="title"><title id="title">Uptake and consumption</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#28766b"/></marker></defs><rect width="380" height="375" rx="12" fill="#f7fbf9"/><g font-family="Arial, sans-serif"><text x="190" y="28" font-size="18" fill="#173f43" text-anchor="middle">Uptake and consumption</text><rect x="115" y="65" width="150" height="65" rx="9" fill="#e5f3ed" stroke="#98bdb0"/><text x="190.0" y="102.5" font-size="17" fill="#173f43" text-anchor="middle">Cellular pool</text><path d="M35 95 L110 95" fill="none" stroke="#28766b" stroke-width="2.5" marker-end="url(#a)"/><path d="M270 95 L345 95" fill="none" stroke="#28766b" stroke-width="2.5" marker-end="url(#a)"/><text x="65" y="60" font-size="15" fill="#173f43" text-anchor="middle">6/min</text><text x="315" y="60" font-size="15" fill="#173f43" text-anchor="middle">6/min</text><text x="190" y="165" font-size="17" fill="#173f43" text-anchor="middle">Before: 6 − 6 = 0</text><rect x="115" y="205" width="150" height="65" rx="9" fill="#e5f3ed" stroke="#98bdb0"/><text x="190.0" y="242.5" font-size="17" fill="#173f43" text-anchor="middle">Cellular pool</text><path d="M35 237 L110 237" fill="none" stroke="#28766b" stroke-width="2.5" marker-end="url(#a)"/><path d="M270 237 L345 237" fill="none" stroke="#28766b" stroke-width="2.5" marker-end="url(#a)"/><text x="65" y="200" font-size="15" fill="#173f43" text-anchor="middle">6/min</text><text x="315" y="200" font-size="15" fill="#173f43" text-anchor="middle">2/min</text><text x="190" y="310" font-size="17" fill="#173f43" text-anchor="middle">After: 6 − 2 = 4 units/min</text><text x="190" y="345" font-size="16" fill="#173f43" text-anchor="middle">In 5 minutes: +20 units</text></g></svg>