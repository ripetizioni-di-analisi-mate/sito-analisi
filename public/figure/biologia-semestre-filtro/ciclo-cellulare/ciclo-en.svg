<svg xmlns="http://www.w3.org/2000/svg" width="520" height="495" viewBox="0 0 520 495" role="img" aria-labelledby="title"><title id="title">DNA content through the cell cycle</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#365e52"/></marker></defs><rect width="520" height="495" rx="14" fill="#f7faf8"/><g font-family="Arial,sans-serif" font-size="21" fill="#193a32" stroke-linecap="round"><rect x="40" y="15" width="440" height="78" rx="10" fill="#e2eee7" stroke="#729b89" stroke-width="1.5"/><text x="260.0" y="48.5" text-anchor="middle" font-size="21" fill="#193a32">G1</text><text x="260.0" y="73.5" text-anchor="middle" font-size="21" fill="#193a32">2n · 2C</text><path d="M260 95L260 116" fill="none" stroke="#365e52" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="120" width="440" height="78" rx="10" fill="#e2eee7" stroke="#729b89" stroke-width="1.5"/><text x="260.0" y="153.5" text-anchor="middle" font-size="21" fill="#193a32">S</text><text x="260.0" y="178.5" text-anchor="middle" font-size="21" fill="#193a32">DNA replication</text><path d="M260 200L260 221" fill="none" stroke="#365e52" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="225" width="440" height="78" rx="10" fill="#e2eee7" stroke="#729b89" stroke-width="1.5"/><text x="260.0" y="258.5" text-anchor="middle" font-size="21" fill="#193a32">G2 / M before anaphase</text><text x="260.0" y="283.5" text-anchor="middle" font-size="21" fill="#193a32">2n · 4C</text><path d="M260 305L260 326" fill="none" stroke="#365e52" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="330" width="440" height="78" rx="10" fill="#e2eee7" stroke="#729b89" stroke-width="1.5"/><text x="260.0" y="376.0" text-anchor="middle" font-size="21" fill="#193a32">Each daughter: 2n · 2C</text><text x="260" y="445" text-anchor="middle" font-size="20" fill="#193a32">n: one chromosome set</text><text x="260" y="473" text-anchor="middle" font-size