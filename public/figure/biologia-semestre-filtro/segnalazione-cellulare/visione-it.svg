<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" role="img" aria-labelledby="title"><title id="title">Fototrasduzione del bastoncello</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176e59"/></marker></defs><text x="220" y="30" text-anchor="middle" font-size="22" fill="currentColor">Risposta alla luce</text><rect x="30" y="55" width="380" height="51" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="86.5" text-anchor="middle" font-size="19" fill="currentColor">Luce → rodopsina</text><line x1="220" y1="108" x2="220" y2="131" stroke="#176e59" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="135" width="380" height="51" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="166.5" text-anchor="middle" font-size="19" fill="currentColor">Transducina → PDE6</text><line x1="220" y1="188" x2="220" y2="211" stroke="#176e59" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="215" width="380" height="51" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="246.5" text-anchor="middle" font-size="19" fill="currentColor">Il cGMP diminuisce</text><line x1="220" y1="268" x2="220" y2="291" stroke="#176e59" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="295" width="380" height="51" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="326.5" text-anchor="middle" font-size="19" fill="currentColor">Si chiudono canali cationici</text><line x1="220" y1="348" x2="220" y2="371" stroke="#176e59" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="375" width="380" height="51" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="406.5" text-anchor="middle" font-size="19" fill="currentColor">Iperpolarizzazione</text><line x1="220" y1="428" x2="220" y2="451" stroke="#176e59" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="455" width="380" height="51" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="486.5" text-anchor="middle" font-size="19" fill="currentColor">Diminuisce il glutammato</text><text x="220" y="570" text-anchor="middle" font-size="17" fill="currentColor">Buio: più canali cGMP aperti</text></svg>