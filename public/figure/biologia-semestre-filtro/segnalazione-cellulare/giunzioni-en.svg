<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 645" role="img" aria-labelledby="title"><title id="title">Cell junctions</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176e59"/></marker></defs><rect width="440" height="645" rx="12" fill="#f8fbfa"/><text x="220" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#173d35">Different connections</text><text x="220" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173d35">Adherens junction</text><rect x="22" y="80" width="396" height="53" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="112.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#173d35">Actin • cadherins • actin</text><text x="220" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173d35">Desmosome</text><rect x="22" y="185" width="396" height="53" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="217.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#173d35">IF • cadherins • IF</text><text x="220" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173d35">Hemidesmosome</text><rect x="22" y="290" width="396" height="53" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="322.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#173d35">IF • integrins • matrix</text><text x="220" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173d35">Tight junction</text><rect x="22" y="395" width="396" height="53" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="427.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#173d35">Paracellular barrier</text><text x="220" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173d35">Gap junction</text><rect x="22" y="500" width="396" height="53" rx="8" fill="white" stroke="#176e59" stroke-width="2"/><text x="220.0" y="532.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#173d35">Cytoplasm ↔ cytoplasm</text><text x="220" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173d35">IF = intermediate filaments</text></svg>