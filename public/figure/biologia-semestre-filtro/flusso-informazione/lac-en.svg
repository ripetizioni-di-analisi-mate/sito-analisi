<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" width="520" height="424" role="img" aria-labelledby="title desc"><title id="title">lac operon: classical model</title><desc id="desc">High expression requires both conditions; a basal level remains possible.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22334b"/></marker></defs><g><text x="260" y="28" text-anchor="middle" font-size="21" fill="currentColor">lac operon: classical model</text><text x="90" y="72" text-anchor="middle" font-size="18" fill="currentColor">Lactose</text><text x="250" y="72" text-anchor="middle" font-size="18" fill="currentColor">Glucose</text><text x="420" y="72" text-anchor="middle" font-size="18" fill="currentColor">Transcription</text><rect x="25" y="90" width="470" height="44" rx="9" fill="#f5f7fa" stroke="#d1d9e1" stroke-width="2"/><text x="90" y="118" text-anchor="middle" font-size="18" fill="currentColor">−</text><text x="250" y="118" text-anchor="middle" font-size="18" fill="currentColor">+</text><text x="420" y="118" text-anchor="middle" font-size="18" fill="currentColor">minimal</text><rect x="25" y="143" width="470" height="44" rx="9" fill="#f5f7fa" stroke="#d1d9e1" stroke-width="2"/><text x="90" y="171" text-anchor="middle" font-size="18" fill="currentColor">−</text><text x="250" y="171" text-anchor="middle" font-size="18" fill="currentColor">−</text><text x="420" y="171" text-anchor="middle" font-size="18" fill="currentColor">minimal</text><rect x="25" y="196" width="470" height="44" rx="9" fill="#f5f7fa" stroke="#d1d9e1" stroke-width="2"/><text x="90" y="224" text-anchor="middle" font-size="18" fill="currentColor">+</text><text x="250" y="224" text-anchor="middle" font-size="18" fill="currentColor">+</text><text x="420" y="224" text-anchor="middle" font-size="18" fill="currentColor">low</text><rect x="25" y="249" width="470" height="44" rx="9" fill="#e1f1ec" stroke="#d1d9e1" stroke-width="2"/><text x="90" y="277" text-anchor="middle" font-size="18" fill="currentColor">+</text><text x="250" y="277" text-anchor="middle" font-size="18" fill="currentColor">−</text><text x="420" y="277" text-anchor="middle" font-size="18" fill="currentColor">high</text><text x="260" y="333" text-anchor="middle" font-size="17" fill="currentColor">− absent/scarce; + available</text><text x="260" y="370" text-anchor="middle" font-size="18" fill="currentColor">Lactose → less repression</text><text x="260" y="401" text-anchor="middle" font-size="18" fill="currentColor">Low glucose → active CAP-cAMP</text></g></svg>