<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 438" width="520" height="438" role="img" aria-labelledby="title desc"><title id="title">Forcella diretta verso destra</title><desc id="desc">Lo stampo superiore permette sintesi continua verso la forcella; i frammenti inferiori si allungano verso sinistra.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22334b"/></marker></defs><g><text x="260" y="29" text-anchor="middle" font-size="21" fill="currentColor">Forcella diretta verso destra</text><line x1="365" y1="65" x2="480" y2="65" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="55,125 330,125 420,235 480,235" fill="none" stroke="#8054a2" stroke-width="4"/><polyline points="55,345 330,345 420,255 480,255" fill="none" stroke="#8054a2" stroke-width="4"/><text x="30" y="132" text-anchor="middle" font-size="18" fill="currentColor">3′</text><text x="30" y="352" text-anchor="middle" font-size="18" fill="currentColor">5′</text><text x="497" y="241" text-anchor="middle" font-size="15" fill="currentColor">5′</text><text x="497" y="269" text-anchor="middle" font-size="15" fill="currentColor">3′</text><line x1="80" y1="163" x2="305" y2="163" stroke="#187b70" stroke-width="5" marker-end="url(#arrow)"/><text x="73" y="189" text-anchor="middle" font-size="16" fill="currentColor">5′</text><text x="313" y="189" text-anchor="middle" font-size="16" fill="currentColor">3′</text><text x="200" y="108" text-anchor="middle" font-size="17" fill="currentColor">stampo leading</text><text x="190" y="218" text-anchor="middle" font-size="18" fill="currentColor">sintesi continua</text><line x1="170" y1="303" x2="75" y2="303" stroke="#187b70" stroke-width="5" marker-end="url(#arrow)"/><line x1="310" y1="303" x2="215" y2="303" stroke="#187b70" stroke-width="5" marker-end="url(#arrow)"/><text x="75" y="287" text-anchor="middle" font-size="16" fill="currentColor">3′</text><text x="170" y="287" text-anchor="middle" font-size="16" fill="currentColor">5′</text><text x="215" y="287" text-anchor="middle" font-size="16" fill="currentColor">3′</text><text x="310" y="287" text-anchor="middle" font-size="16" fill="currentColor">5′</text><text x="195" y="381" text-anchor="middle" font-size="18" fill="currentColor">frammenti di Okazaki</text><text x="260" y="416" text-anchor="middle" font-size="18" fill="currentColor">Ogni catena nuova cresce 5′ → 3′.</text></g></svg>