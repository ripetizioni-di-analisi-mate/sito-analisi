<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 417" width="520" height="417" role="img" aria-labelledby="title desc"><title id="title">Alternative splicing</title><desc id="desc">Three exons in the precursor; one isoform includes all three, the other joins E1 directly to E3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22334b"/></marker></defs><g><text x="260" y="28" text-anchor="middle" font-size="21" fill="currentColor">Alternative splicing</text><text x="260" y="67" text-anchor="middle" font-size="18" fill="currentColor">pre-mRNA</text><line x1="48" y1="112" x2="472" y2="112" stroke="#22334b" stroke-width="3"/><rect x="48" y="88" width="80" height="48" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="88" y="118" text-anchor="middle" font-size="18" fill="currentColor">E1</text><rect x="220" y="88" width="80" height="48" rx="9" fill="#efe6f5" stroke="#187b70" stroke-width="2"/><text x="260" y="118" text-anchor="middle" font-size="18" fill="currentColor">E2</text><rect x="392" y="88" width="80" height="48" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="432" y="118" text-anchor="middle" font-size="18" fill="currentColor">E3</text><text x="174" y="98" text-anchor="middle" font-size="15" fill="currentColor">I1</text><text x="346" y="98" text-anchor="middle" font-size="15" fill="currentColor">I2</text><line x1="190" y1="143" x2="130" y2="193" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><line x1="330" y1="143" x2="390" y2="193" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><text x="130" y="218" text-anchor="middle" font-size="18" fill="currentColor">isoform A</text><text x="390" y="218" text-anchor="middle" font-size="18" fill="currentColor">isoform B</text><rect x="25" y="242" width="70" height="46" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="60" y="271" text-anchor="middle" font-size="17" fill="currentColor">E1</text><rect x="95" y="242" width="70" height="46" rx="9" fill="#efe6f5" stroke="#187b70" stroke-width="2"/><text x="130" y="271" text-anchor="middle" font-size="17" fill="currentColor">E2</text><rect x="165" y="242" width="70" height="46" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="200" y="271" text-anchor="middle" font-size="17" fill="currentColor">E3</text><rect x="315" y="242" width="70" height="46" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="350" y="271" text-anchor="middle" font-size="17" fill="currentColor">E1</text><rect x="385" y="242" width="70" height="46" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="420" y="271" text-anchor="middle" font-size="17" fill="currentColor">E3</text><text x="260" y="329" text-anchor="middle" font-size="18" fill="currentColor">Introns I1 and I2 are removed.</text><text x="260" y="361" text-anchor="middle" font-size="18" fill="currentColor">Isoform B also skips E2.</text><text x="260" y="394" text-anchor="middle" font-size="16" fill="currentColor">Lengths are not drawn to scale.</text></g></svg>