<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 425" width="520" height="425" role="img" aria-labelledby="title desc"><title id="title">Allungamento della traduzione</title><desc id="desc">Schema prima del legame peptidico: il tRNA in P porta la catena e quello in A il nuovo amminoacido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22334b"/></marker></defs><rect width="520" height="425" fill="#fff"/><g font-family="Arial, sans-serif"><text x="260" y="29" text-anchor="middle" font-size="21" fill="#22334b">Allungamento della traduzione</text><rect x="70" y="65" width="380" height="230" rx="9" fill="#f0edf6" stroke="#8054a2" stroke-width="2"/><rect x="102" y="137" width="76" height="105" rx="9" fill="#fff" stroke="#b5a5c8" stroke-width="2"/><text x="140" y="119" text-anchor="middle" font-size="22" fill="#22334b">E</text><rect x="222" y="137" width="76" height="105" rx="9" fill="#fff" stroke="#b5a5c8" stroke-width="2"/><text x="260" y="119" text-anchor="middle" font-size="22" fill="#22334b">P</text><rect x="342" y="137" width="76" height="105" rx="9" fill="#fff" stroke="#b5a5c8" stroke-width="2"/><text x="380" y="119" text-anchor="middle" font-size="22" fill="#22334b">A</text><line x1="35" y1="263" x2="485" y2="263" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><text x="24" y="292" text-anchor="middle" font-size="16" fill="#22334b">5′</text><text x="494" y="292" text-anchor="middle" font-size="16" fill="#22334b">3′</text><text x="140" y="193" text-anchor="middle" font-size="17" fill="#22334b">tRNA</text><text x="140" y="218" text-anchor="middle" font-size="19" fill="#22334b">−</text><text x="260" y="193" text-anchor="middle" font-size="17" fill="#22334b">tRNA</text><text x="380" y="193" text-anchor="middle" font-size="17" fill="#22334b">tRNA</text><circle cx="200" cy="86" r="6" fill="#187b70"/><circle cx="215" cy="86" r="6" fill="#187b70"/><circle cx="230" cy="86" r="6" fill="#187b70"/><circle cx="245" cy="86" r="6" fill="#187b70"/><circle cx="260" cy="86" r="6" fill="#187b70"/><circle cx="380" cy="86" r="6" fill="#187b70"/><line x1="280" y1="81" x2="360" y2="81" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><text x="260" y="332" text-anchor="middle" font-size="18" fill="#22334b">Trasferimento della catena: P → A</text><text x="260" y="365" text-anchor="middle" font-size="18" fill="#22334b">Poi traslocazione: A → P → E</text><text x="260" y="398" text-anchor="middle" font-size="18" fill="#22334b">Il ribosoma avanza sull’mRNA.</text></g></svg>