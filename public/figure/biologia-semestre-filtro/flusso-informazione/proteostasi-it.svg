<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 533" width="520" height="533" role="img" aria-labelledby="title desc"><title id="title">Controllo della qualità proteica</title><desc id="desc">La chaperon assiste il ripiegamento; alcuni substrati non recuperati vengono ubiquitinati e degradati dal proteasoma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22334b"/></marker></defs><g><text x="260" y="29" text-anchor="middle" font-size="21" fill="currentColor">Controllo della qualità proteica</text><rect x="130" y="60" width="260" height="55" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="260.0" y="93.5" text-anchor="middle" font-size="17" fill="currentColor">Proteina neosintetizzata</text><line x1="260" y1="119" x2="260" y2="154" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="163" width="260" height="62" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="260.0" y="189.0" text-anchor="middle" font-size="17" fill="currentColor">Ripiegamento assistito</text><text x="260.0" y="211.0" text-anchor="middle" font-size="17" fill="currentColor">chaperon + ATP</text><line x1="180" y1="229" x2="125" y2="270" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><line x1="340" y1="229" x2="395" y2="270" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="282" width="210" height="63" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="125.0" y="308.5" text-anchor="middle" font-size="17" fill="currentColor">Struttura funzionale</text><text x="125.0" y="330.5" text-anchor="middle" font-size="17" fill="currentColor">attività</text><rect x="290" y="282" width="210" height="63" rx="9" fill="#fff0e8" stroke="#187b70" stroke-width="2"/><text x="395.0" y="308.5" text-anchor="middle" font-size="17" fill="currentColor">Difetto persistente</text><text x="395.0" y="330.5" text-anchor="middle" font-size="17" fill="currentColor">selezione del substrato</text><line x1="395" y1="350" x2="395" y2="385" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="397" width="210" height="73" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="395.0" y="428.5" text-anchor="middle" font-size="17" fill="currentColor">E1 → E2 → E3</text><text x="395.0" y="450.5" text-anchor="middle" font-size="17" fill="currentColor">poliubiquitina</text><line x1="286" y1="434" x2="231" y2="434" stroke="#22334b" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="397" width="210" height="73" rx="9" fill="#e9f4f1" stroke="#187b70" stroke-width="2"/><text x="125.0" y="428.5" text-anchor="middle" font-size="17" fill="currentColor">Proteasoma + ATP</text><text x="125.0" y="450.5" text-anchor="middle" font-size="17" fill="currentColor">peptidi</text><text x="260" y="510" text-anchor="middle" font-size="16" fill="currentColor">Una delle vie possibili; dipende dal substrato.</text></g></svg>