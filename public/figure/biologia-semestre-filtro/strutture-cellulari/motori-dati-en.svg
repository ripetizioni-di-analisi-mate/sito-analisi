<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330" role="img" aria-labelledby="title desc"><title id="title">Cargo movement along a microtubule</title><desc id="desc">Cargo movement along a microtubule</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#17635b"/></marker></defs><g><text x="250" y="30" font-size="20" text-anchor="middle" fill="currentColor">Initial datum and positions after 6 s</text><text x="250" y="67" font-size="18" text-anchor="middle" fill="currentColor">x axis towards the plus end</text><path d="M50,170 L460,170" fill="none" stroke="#17635b" stroke-width="3" marker-end="url(#arrow)"/><path d="M50 164 V178" stroke="#153b38" stroke-width="2"/><text x="50" y="202" font-size="18" text-anchor="middle" fill="currentColor">0</text><path d="M215 164 V178" stroke="#153b38" stroke-width="2"/><text x="215" y="202" font-size="18" text-anchor="middle" fill="currentColor">5</text><path d="M314 164 V178" stroke="#153b38" stroke-width="2"/><text x="314" y="202" font-size="18" text-anchor="middle" fill="currentColor">8</text><path d="M413 164 V178" stroke="#153b38" stroke-width="2"/><text x="413" y="202" font-size="18" text-anchor="middle" fill="currentColor">11</text><path d="M446 164 V178" stroke="#153b38" stroke-width="2"/><text x="446" y="202" font-size="18" text-anchor="middle" fill="currentColor">12</text><text x="456" y="229" font-size="17" text-anchor="end" fill="currentColor">x (μm)</text><circle cx="314" cy="170" r="7" fill="#b44843"/><text x="314" y="110" font-size="18" text-anchor="middle" fill="currentColor">Start: 8 μm</text><path d="M310,135 L219,135" fill="none" stroke="#17635b" stroke-width="3" marker-end="url(#arrow)"/><text x="238" y="126" font-size="16" text-anchor="middle" fill="currentColor">dynein</text><path d="M319,145 L409,145" fill="none" stroke="#17635b" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="126" font-size="16" text-anchor="middle" fill="currentColor">plus motor</text><text x="250" y="270" font-size="18" text-anchor="middle" fill="currentColor">Dynein: 8 − 0.5 × 6 = 5 μm</text><text x="250" y="302" font-size="18" text-anchor="middle" fill="currentColor">Plus motor: 8 + 0.5 × 6 = 11 μm</text></g></svg>