<svg id="disegno" xmlns="http://www.w3.org/2000/svg" width="500" height="415" viewBox="0 0 500 415" role="img" aria-labelledby="title desc"><title id="title">Pump and secondary active transport</title><desc id="desc">Pump and secondary active transport</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#17635b"/></marker></defs><g><text x="250" y="30" font-size="20" text-anchor="middle" fill="currentColor">Two ways of transporting solutes</text><text x="250" y="67" font-size="19" text-anchor="middle" fill="currentColor">Outside: relatively high Na⁺</text><rect x="20" y="170" width="460" height="65" fill="#e2f0e9"/><rect x="65" y="160" width="120" height="85" rx="12" fill="#f0f7f5" stroke="#17635b" stroke-width="2"/><text x="125.0" y="202.5" font-size="19" text-anchor="middle" fill="currentColor">Na⁺/K⁺</text><text x="125.0" y="226.5" font-size="19" text-anchor="middle" fill="currentColor">ATPase</text><rect x="310" y="160" width="125" height="85" rx="12" fill="#f0f7f5" stroke="#17635b" stroke-width="2"/><text x="372.5" y="208.5" font-size="19" text-anchor="middle" fill="currentColor">Cotransport</text><path d="M45,280 L45,110" fill="none" stroke="#17635b" stroke-width="3" marker-end="url(#arrow)"/><text x="63" y="115" font-size="17" text-anchor="start" fill="currentColor">3 Na⁺</text><path d="M205,110 L205,280" fill="none" stroke="#17635b" stroke-width="3" marker-end="url(#arrow)"/><text x="215" y="130" font-size="17" text-anchor="start" fill="currentColor">2 K⁺</text><path d="M375,100 L375,150" fill="none" stroke="#17635b" stroke-width="3" marker-end="url(#arrow)"/><path d="M375,250 L375,300" fill="none" stroke="#17635b" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="91" font-size="17" text-anchor="middle" fill="currentColor">Na⁺ + glucose</text><text x="125" y="315" font-size="17" text-anchor="middle" fill="currentColor">ATP → ADP + Pi</text><text x="250" y="355" font-size="19" text-anchor="middle" fill="currentColor">Cytosol: relatively low Na⁺</text><text x="250" y="390" font-size="17" text-anchor="middle" fill="currentColor">The Na⁺ gradient powers cotransport</text></g></svg>