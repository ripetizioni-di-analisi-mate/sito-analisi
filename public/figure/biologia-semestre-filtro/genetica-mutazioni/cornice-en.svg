<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">Deletion and reading frame</title><desc id="desc">Sequence AUG GAA UUU GGC; after deletion: AUG AAU UUG GC.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#173448"/></marker></defs><rect width="600" height="440" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="300" y="38" fill="#173448" text-anchor="middle" font-size="27" font-weight="700">Deletion and reading frame</text><text x="32" y="88" fill="#173448" text-anchor="start" font-size="23" font-weight="400">Before deletion</text><rect x="35" y="109" width="120" height="60" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="95" y="149" fill="#173448" text-anchor="middle" font-size="29" font-weight="700">AUG</text><rect x="175" y="109" width="120" height="60" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="235" y="149" fill="#173448" text-anchor="middle" font-size="29" font-weight="700">GAA</text><rect x="315" y="109" width="120" height="60" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="375" y="149" fill="#173448" text-anchor="middle" font-size="29" font-weight="700">UUU</text><rect x="455" y="109" width="120" height="60" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="515" y="149" fill="#173448" text-anchor="middle" font-size="29" font-weight="700">GGC</text><text x="300" y="210" fill="#173448" text-anchor="middle" font-size="23" font-weight="400">First G of the second codon deleted</text><line x1="300" y1="224" x2="300" y2="254" stroke="#173448" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="275" width="120" height="60" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="95" y="315" fill="#173448" text-anchor="middle" font-size="29" font-weight="700">AUG</text><rect x="175" y="275" width="120" height="60" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="235" y="315" fill="#173448" text-anchor="middle" font-size="29" font-weight="700">AAU</text><rect x="315" y="275" width="120" height="60" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="375" y="315" fill="#173448" text-anchor="middle" font-size="29" font-weight="700">UUG</text><rect x="455" y="275" width="120" height="60" rx="12" fill="#eef2f5" stroke="#117b78" stroke-width="2"/><text x="515" y="315" fill="#173448" text-anchor="middle" font-size="29" font-weight="700">GC</text><text x="300" y="375" fill="#173448" text-anchor="middle" font-size="23" font-weight="400">Same start, different downstream triplets</text><text x="300" y="411" fill="#476274" text-anchor="middle" font-size="22" font-weight="400">GC: only two bases in the tract shown</text></g></svg>