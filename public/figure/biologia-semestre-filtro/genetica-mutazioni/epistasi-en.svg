<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title desc"><title id="title">Recessive epistasis</title><desc id="desc">Nine purple fractions, three red and four unpigmented in the model.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#173448"/></marker></defs><rect width="600" height="520" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="300" y="38" fill="#173448" text-anchor="middle" font-size="27" font-weight="700">Recessive epistasis</text><text x="300" y="82" fill="#173448" text-anchor="middle" font-size="28" font-weight="700">AaBb × AaBb</text><rect x="145" y="108" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="223" y="108" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="301" y="108" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="379" y="108" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="145" y="168" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="223" y="168" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="301" y="168" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="379" y="168" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="145" y="228" width="63" height="46" rx="12" fill="#7256a8" stroke="#7256a8" stroke-width="2"/><rect x="223" y="228" width="63" height="46" rx="12" fill="#b45252" stroke="#b45252" stroke-width="2"/><rect x="301" y="228" width="63" height="46" rx="12" fill="#b45252" stroke="#b45252" stroke-width="2"/><rect x="379" y="228" width="63" height="46" rx="12" fill="#b45252" stroke="#b45252" stroke-width="2"/><rect x="145" y="288" width="63" height="46" rx="12" fil