<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">Combinazioni dei gameti</title><desc id="desc">Quadrato di Punnett Aa per Aa: AA, Aa, Aa, aa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#173448"/></marker></defs><g><text x="300" y="38" fill="currentColor" text-anchor="middle" font-size="27" font-weight="700">Combinazioni dei gameti</text><text x="300" y="81" fill="currentColor" text-anchor="middle" font-size="29" font-weight="700">Aa × Aa</text><text x="270" y="130" fill="currentColor" text-anchor="middle" font-size="29" font-weight="400">A</text><text x="420" y="130" fill="currentColor" text-anchor="middle" font-size="29" font-weight="400">a</text><text x="95" y="220" fill="currentColor" text-anchor="middle" font-size="29" font-weight="400">A</text><text x="95" y="335" fill="currentColor" text-anchor="middle" font-size="29" font-weight="400">a</text><rect x="195" y="155" width="150" height="115" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="270" y="220" fill="currentColor" text-anchor="middle" font-size="34" font-weight="700">AA</text><rect x="345" y="155" width="150" height="115" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="420" y="220" fill="currentColor" text-anchor="middle" font-size="34" font-weight="700">Aa</text><rect x="195" y="270" width="150" height="115" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="270" y="335" fill="currentColor" text-anchor="middle" font-size="34" font-weight="700">Aa</text><rect x="345" y="270" width="150" height="115" rx="12" fill="#eef2f5" stroke="#117b78" stroke-width="2"/><text x="420" y="335" fill="currentColor" text-anchor="middle" font-size="34" font-weight="700">aa</text><text x="300" y="430" fill="currentColor" text-anchor="middle" font-size="24" font-weight="400">Ogni casella ha probabilità 1/4</text><text x="300" y="465" fill="currentColor" text-anchor="middle" font-size="23" font-weight="400">Aa compare in due caselle: 1/2</text></g></svg>