<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 526" role="img" aria-labelledby="title desc"><title id="title">Deduction from a pedigree</title><desc id="desc">Unaffected parents with an affected aa son and unaffected daughter: both parents Aa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#173448"/></marker></defs><rect width="600" height="526" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="300" y="38" fill="#173448" text-anchor="middle" font-size="27" font-weight="700">Deduction from a pedigree</text><text x="300" y="83" fill="#173448" text-anchor="middle" font-size="22" font-weight="400">Autosomal recessive; complete penetrance</text><rect x="158" y="116" width="54" height="54" fill="white" stroke="#173448" stroke-width="3"/><circle cx="415" cy="143" r="27" fill="white" stroke="#173448" stroke-width="3"/><line x1="212" y1="143" x2="388" y2="143" stroke="#173448" stroke-width="3"/><line x1="300" y1="143" x2="300" y2="247" stroke="#173448" stroke-width="3"/><line x1="160" y1="247" x2="440" y2="247" stroke="#173448" stroke-width="3"/><line x1="160" y1="247" x2="160" y2="288" stroke="#173448" stroke-width="3"/><line x1="440" y1="247" x2="440" y2="288" stroke="#173448" stroke-width="3"/><text x="185" y="204" fill="#173448" text-anchor="middle" font-size="27" font-weight="400">Aa</text><text x="415" y="204" fill="#173448" text-anchor="middle" font-size="27" font-weight="400">Aa</text><rect x="133" y="288" width="54" height="54" fill="#117b78" stroke="#173448" stroke-width="3"/><circle cx="440" cy="315" r="27" fill="white" stroke="#173448" stroke-width="3"/><text x="160" y="379" fill="#173448" text-anchor="middle" font-size="27" font-weight="400">aa</text><text x="440" y="379" fill="#173448" text-anchor="middle" font-size="26" font-weight="400">AA or Aa</text><text x="160" y="414" fill="#117b78" text-anchor="middle" font-size="22" font-weight="400">Affected</text><text x="440" y="414" fill="#173448" text-anchor="middle" font-size="22" font-weight="400">Unaffected</text><text x="300" y="466" fill="#173448" text-anchor="middle" font-size="23" font-weight="400">Daughter: P(Aa | unaffected) = 2/3</text><text x="300" y="501" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">New mutations excluded in the model</text></g></svg>