<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">Dalla lesione alla via</title><desc id="desc">Tre esempi di riconoscimento e riparazione del DNA.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#173448"/></marker></defs><rect width="600" height="490" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="300" y="38" fill="#173448" text-anchor="middle" font-size="27" font-weight="700">Dalla lesione alla via</text><rect x="25" y="76" width="550" height="101" rx="12" fill="#eef2f5" stroke="#cad7df" stroke-width="2"/><text x="300" y="106" fill="#173448" text-anchor="middle" font-size="24" font-weight="700">Base alterata</text><text x="300" y="136" fill="#117b78" text-anchor="middle" font-size="24" font-weight="400">Escissione di basi</text><text x="300" y="163" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Glicosilasi → sito senza base</text><rect x="25" y="198" width="550" height="101" rx="12" fill="#eef2f5" stroke="#cad7df" stroke-width="2"/><text x="300" y="228" fill="#173448" text-anchor="middle" font-size="24" font-weight="700">Lesione UV</text><text x="300" y="258" fill="#117b78" text-anchor="middle" font-size="24" font-weight="400">Escissione di nucleotidi</text><text x="300" y="285" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Rimozione di un tratto</text><rect x="25" y="320" width="550" height="101" rx="12" fill="#eef2f5" stroke="#cad7df" stroke-width="2"/><text x="300" y="350" fill="#173448" text-anchor="middle" font-size="24" font-weight="700">Appaiamento errato</text><text x="300" y="380" fill="#117b78" text-anchor="middle" font-size="24" font-weight="400">Mismatch repair</text><text x="300" y="407" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Correzione dopo replicazione</text><text x="300" y="464" fill="#173448" text-anchor="middle" font-size="23" font-weight="400">Il filamento integro guida la risintesi</text></g></svg>