<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">From lesion to pathway</title><desc id="desc">Three examples of DNA recognition and repair.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#173448"/></marker></defs><g><text x="300" y="38" fill="currentColor" text-anchor="middle" font-size="27" font-weight="700">From lesion to pathway</text><rect x="25" y="76" width="550" height="101" rx="12" fill="#eef2f5" stroke="#cad7df" stroke-width="2"/><text x="300" y="106" fill="currentColor" text-anchor="middle" font-size="24" font-weight="700">Altered base</text><text x="300" y="136" fill="#117b78" text-anchor="middle" font-size="24" font-weight="400">Base excision</text><text x="300" y="163" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Glycosylase → abasic site</text><rect x="25" y="198" width="550" height="101" rx="12" fill="#eef2f5" stroke="#cad7df" stroke-width="2"/><text x="300" y="228" fill="currentColor" text-anchor="middle" font-size="24" font-weight="700">UV lesion</text><text x="300" y="258" fill="#117b78" text-anchor="middle" font-size="24" font-weight="400">Nucleotide excision</text><text x="300" y="285" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Removal of a tract</text><rect x="25" y="320" width="550" height="101" rx="12" fill="#eef2f5" stroke="#cad7df" stroke-width="2"/><text x="300" y="350" fill="currentColor" text-anchor="middle" font-size="24" font-weight="700">Mismatch</text><text x="300" y="380" fill="#117b78" text-anchor="middle" font-size="24" font-weight="400">Mismatch repair</text><text x="300" y="407" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Post-replication correction</text><text x="300" y="464" fill="currentColor" text-anchor="middle" font-size="23" font-weight="400">The intact strand guides resynthesis</text></g></svg>