<svg id="disegno" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">Imprinting: origine della copia</title><desc id="desc">Schema della copia materna silenziata e della copia paterna espressa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#173448"/></marker></defs><g><text x="300" y="38" fill="currentColor" text-anchor="middle" font-size="27" font-weight="700">Imprinting: origine della copia</text><text x="300" y="88" fill="currentColor" text-anchor="middle" font-size="24" font-weight="400">Modello: copia materna silenziata</text><rect x="32" y="115" width="536" height="111" rx="12" fill="#eef2f5" stroke="#cad7df" stroke-width="2"/><text x="300" y="149" fill="currentColor" text-anchor="middle" font-size="27" font-weight="700">Copia materna</text><line x1="92" y1="182" x2="508" y2="182" stroke="#92a1ab" stroke-width="8"/><text x="300" y="213" fill="#476274" text-anchor="middle" font-size="22" font-weight="400">Silenziata nel tessuto considerato</text><rect x="32" y="252" width="536" height="160" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="300" y="288" fill="currentColor" text-anchor="middle" font-size="27" font-weight="700">Copia paterna</text><line x1="92" y1="321" x2="508" y2="321" stroke="#117b78" stroke-width="8"/><line x1="300" y1="336" x2="300" y2="362" stroke="#173448" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="393" fill="#117b78" text-anchor="middle" font-size="25" font-weight="400">Trascritto prodotto</text><text x="300" y="456" fill="#476274" text-anchor="middle" font-size="22" font-weight="400">L’origine è riferita ai genitori del figlio</text></g></svg>