<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title desc"><title id="title">Fase e frequenze gametiche</title><desc id="desc">Parentali AB e ab al40 per cento ciascuno; ricombinanti Ab e aB al10 ciascuno.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#173448"/></marker></defs><rect width="600" height="520" rx="16" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="300" y="38" fill="#173448" text-anchor="middle" font-size="27" font-weight="700">Fase e frequenze gametiche</text><text x="300" y="84" fill="#173448" text-anchor="middle" font-size="26" font-weight="400">Fase iniziale: AB/ab</text><line x1="155" y1="126" x2="445" y2="126" stroke="#117b78" stroke-width="10"/><line x1="155" y1="184" x2="445" y2="184" stroke="#377cc0" stroke-width="10"/><text x="190" y="113" fill="#173448" text-anchor="middle" font-size="26" font-weight="700">A</text><text x="410" y="113" fill="#173448" text-anchor="middle" font-size="26" font-weight="700">B</text><text x="190" y="171" fill="#173448" text-anchor="middle" font-size="26" font-weight="700">a</text><text x="410" y="171" fill="#173448" text-anchor="middle" font-size="26" font-weight="700">b</text><text x="300" y="233" fill="#173448" text-anchor="middle" font-size="27" font-weight="700">r = 20%</text><rect x="35" y="266" width="240" height="86" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="100" y="302" fill="#173448" text-anchor="middle" font-size="30" font-weight="700">AB</text><text x="209" y="302" fill="#173448" text-anchor="middle" font-size="27" font-weight="400">40%</text><text x="155" y="333" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Parentale</text><rect x="325" y="266" width="240" height="86" rx="12" fill="#e6f3f1" stroke="#117b78" stroke-width="2"/><text x="390" y="302" fill="#173448" text-anchor="middle" font-size="30" font-weight="700">ab</text><text x="499" y="302" fill="#173448" text-anchor="middle" font-size="27" font-weight="400">40%</text><text x="445" y="333" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Parentale</text><rect x="35" y="370" width="240" height="86" rx="12" fill="#eef2f5" stroke="#117b78" stroke-width="2"/><text x="100" y="406" fill="#173448" text-anchor="middle" font-size="30" font-weight="700">Ab</text><text x="209" y="406" fill="#173448" text-anchor="middle" font-size="27" font-weight="400">10%</text><text x="155" y="437" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Ricombinante</text><rect x="325" y="370" width="240" height="86" rx="12" fill="#eef2f5" stroke="#117b78" stroke-width="2"/><text x="390" y="406" fill="#173448" text-anchor="middle" font-size="30" font-weight="700">aB</text><text x="499" y="406" fill="#173448" text-anchor="middle" font-size="27" font-weight="400">10%</text><text x="445" y="437" fill="#476274" text-anchor="middle" font-size="21" font-weight="400">Ricombinante</text><text x="300" y="497" fill="#173448" text-anchor="middle" font-size="23" font-weight="400">20% complessivo = 10% + 10%</text></g></svg>